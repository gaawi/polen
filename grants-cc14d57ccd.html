<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Polen · Grants Feed</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f1;--s1:#ffffff;--s2:#efeadd;--s3:#e3ddca;
  --bd:#d4cdb8;--bd2:#bfb69e;
  --t:#0e0d0a;--td:#5a5446;--tf:#8b8475;
  --ac:#d39400;--acbg:rgba(211,148,0,.08);
  --g:#2d8f4a;--gbg:rgba(45,143,74,.1);
  --r:#c83434;--rbg:rgba(200,52,52,.1);
  --b:#2d5dbb;
  --font:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
html.dark{
  --bg:#0e0d0a;--s1:#15130f;--s2:#1c1a14;--s3:#26221a;
  --bd:#2a2620;--bd2:#3a3528;
  --t:#f4ede0;--td:#8a8475;--tf:#5c5749;
  --ac:#ffd233;--acbg:rgba(255,210,51,.08);
  --g:#6ee08e;--gbg:rgba(110,224,142,.1);
  --r:#ff6b6b;--rbg:rgba(255,107,107,.1);
  --b:#7dafff;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--t);font-size:12px;line-height:1.5;transition:background .2s,color .2s;}

/* ── Shared nav ── */
.nav{display:flex;align-items:center;gap:2px;padding:0 12px;background:var(--s1);border-bottom:1px solid var(--bd);height:40px;position:sticky;top:0;z-index:10;}
.nav-brand{font-size:13px;font-weight:800;color:var(--ac);letter-spacing:.06em;padding:0 10px 0 2px;margin-right:4px;border-right:1px solid var(--bd);flex-shrink:0;}
.nav-link{background:none;border:none;color:var(--td);font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:all .15s;font-family:var(--font);white-space:nowrap;}
.nav-link:hover{color:var(--t);background:var(--s3);}
.nav-link.active{color:var(--ac);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:4px;}
.theme-btn{background:none;border:1px solid var(--bd);color:var(--td);border-radius:3px;padding:3px 8px;font-size:13px;cursor:pointer;line-height:1;transition:all .15s;}
.theme-btn:hover{border-color:var(--ac);color:var(--t);}

/* ── Content ── */
.wrap{padding:20px 20px 40px;max-width:1200px;}
.page-title{font-size:13px;font-weight:700;color:var(--t);margin-bottom:2px;letter-spacing:.03em;}
.sub{color:var(--tf);font-size:11px;margin-bottom:20px;}
.stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;}
.stat strong{color:var(--ac);font-size:16px;font-weight:800;display:block;margin-bottom:1px;}
.stat span{font-size:10px;color:var(--tf);text-transform:uppercase;letter-spacing:.06em;}
.section{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--tf);margin-bottom:6px;margin-top:20px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--tf);padding:5px 10px;border-bottom:1px solid var(--bd);font-weight:700;background:var(--s2);position:sticky;top:40px;}
td{padding:5px 10px;border-bottom:1px solid var(--s2);font-size:12px;vertical-align:top;word-break:break-word;}
tr:hover td{background:var(--s3);}
.f{font-weight:700;}
.g-{color:var(--td);}
.d{white-space:nowrap;color:var(--tf);}
.badge{display:inline-block;padding:1px 7px;border-radius:2px;font-size:9px;font-weight:700;text-transform:uppercase;}
.b-apply{background:var(--rbg);color:var(--r);}
.b-waiting{background:rgba(45,93,187,.1);color:var(--b);}
.b-received{background:var(--gbg);color:var(--g);}
.b-denied{background:var(--rbg);color:var(--r);}
.b-check{background:rgba(211,148,0,.1);color:var(--ac);}
.b-other{background:var(--s2);color:var(--tf);}
.amt{color:var(--g);font-weight:700;}
.note{color:var(--tf);font-size:11px;}
pre{background:var(--s2);border:1px solid var(--bd);padding:14px 16px;overflow-x:auto;font-size:11px;color:var(--td);line-height:1.5;margin-top:6px;white-space:pre-wrap;word-break:break-word;}
#msg{color:var(--tf);padding:20px 0;}
#err{color:var(--r);padding:20px 0;display:none;}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-brand">POLEN</span>
  <a href="." class="nav-link">App</a>
  <a href="grants-cc14d57ccd.html" class="nav-link active">Feed</a>
  <a href="suggest-a51084f11a.html" class="nav-link">+ Suggest</a>
  <div class="nav-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-title">GRANTS FEED</div>
  <div class="sub" id="sub">Loading…</div>

  <div id="msg">Fetching grants…</div>
  <div id="err"></div>

  <div id="main" style="display:none">
    <div class="stats">
      <div class="stat"><strong id="cnt-total">—</strong><span>Total entries</span></div>
      <div class="stat"><strong id="cnt-apply">—</strong><span>To apply</span></div>
      <div class="stat"><strong id="cnt-waiting">—</strong><span>Waiting</span></div>
      <div class="stat"><strong id="cnt-received">—</strong><span>Awarded</span></div>
    </div>

    <div class="section">All grants · deduplicated by program · sorted by deadline</div>
    <table>
      <thead>
        <tr>
          <th style="width:170px">Foundation</th>
          <th>Grant Program</th>
          <th style="width:95px">Deadline</th>
          <th style="width:90px">Status</th>
          <th style="width:85px">Amount</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="section" style="margin-top:28px">Raw JSON — full history · all entries</div>
    <pre id="json-out"></pre>
  </div>
</div>

<script>
// Theme
(function(){
  const t=localStorage.getItem('polen-theme');
  if(t==='dark')document.documentElement.classList.add('dark');
  document.getElementById('theme-btn').textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';
})();
function toggleTheme(){
  const dark=document.documentElement.classList.toggle('dark');
  localStorage.setItem('polen-theme',dark?'dark':'light');
  document.getElementById('theme-btn').textContent=dark?'☀️':'🌙';
}

const URL_='https://aqehbiyjofsxavndjfjj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxZWhiaXlqb2ZzeGF2bmRqZmpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NjUwMzUsImV4cCI6MjA5NDM0MTAzNX0.WgMseUQ6YbtZPjjx1i_VuRXTpSI7n9OD6QLUImmmPU0';

const LABEL={'00 Send Proposal':'Apply','01 Apply on deadline':'Apply','02 Check':'Check','03 Waiting Results':'Waiting','04 Denied':'Denied','05 Received':'Received','06 Not Applied':'Not Applied','07 Missed Deadline':'Missed','08 Not Eligible':'Not Eligible'};
const CSS_={'00 Send Proposal':'apply','01 Apply on deadline':'apply','02 Check':'check','03 Waiting Results':'waiting','04 Denied':'denied','05 Received':'received','06 Not Applied':'other','07 Missed Deadline':'other','08 Not Eligible':'other'};

function fmt(n){if(!n)return'—';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1000)return'$'+(n/1000).toFixed(n>=10000?0:1)+'k';return'$'+n.toLocaleString();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function load(){
  try{
    const r=await fetch(`${URL_}/rest/v1/grants_blob?select=data&id=eq.1`,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
    if(!r.ok)throw new Error('HTTP '+r.status+' — run the Supabase SQL to enable public read');
    const rows=await r.json();
    if(!rows.length)throw new Error('No data found');
    const grants=rows[0].data||[];

    document.getElementById('msg').style.display='none';
    document.getElementById('main').style.display='block';
    document.getElementById('cnt-total').textContent=grants.length;
    document.getElementById('cnt-apply').textContent=grants.filter(g=>g.nextStep==='01 Apply on deadline'||g.nextStep==='00 Send Proposal').length;
    document.getElementById('cnt-waiting').textContent=grants.filter(g=>g.nextStep==='03 Waiting Results').length;
    document.getElementById('cnt-received').textContent=grants.filter(g=>g.nextStep==='05 Received').length;

    const sorted=[...grants].sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||''));
    const seen=new Set();
    const deduped=sorted.filter(g=>{const k=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();if(seen.has(k))return false;seen.add(k);return true;});
    const now=new Date().toISOString().slice(0,10);
    deduped.sort((a,b)=>{
      const af=a.deadline&&a.deadline>=now,bf=b.deadline&&b.deadline>=now;
      if(af&&!bf)return -1;if(!af&&bf)return 1;
      if(af&&bf)return(a.deadline||'').localeCompare(b.deadline||'');
      return(b.deadline||'').localeCompare(a.deadline||'');
    });

    const tbody=document.getElementById('tbody');
    deduped.forEach(g=>{
      const amt=g.amountReceived||g.amount;
      const css=CSS_[g.nextStep]||'other';
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td class="f">${esc(g.foundation||'—')}</td>
        <td class="g-">${esc(g.grant||'—')}${g.projectDates?'<br><span style="font-size:10px;color:var(--tf)">'+esc(g.projectDates)+'</span>':''}</td>
        <td class="d">${esc(g.deadline||'—')}${g.deadlineType==='DDLNE!'?'<br><span style="color:var(--r);font-size:9px">HARD</span>':'<br><span style="font-size:9px;color:var(--tf)">est.</span>'}</td>
        <td><span class="badge b-${css}">${esc(LABEL[g.nextStep]||g.nextStep||'—')}</span></td>
        <td class="amt">${fmt(amt)}</td>
        <td class="note">${esc(g.notes||'—')}</td>`;
      tbody.appendChild(tr);
    });

    const jsonData=grants.map(g=>({foundation:g.foundation,grant:g.grant,deadline:g.deadline,deadlineType:g.deadlineType,nextStep:g.nextStep,amount:g.amount,amountReceived:g.amountReceived,eligiblePeriod:g.eligiblePeriod,reportDeadline:g.reportDeadline,projectDates:g.projectDates,web:g.web,notes:g.notes,season:g.season}));
    document.getElementById('json-out').textContent=JSON.stringify(jsonData,null,2);
    document.getElementById('sub').textContent=`${deduped.length} programs · ${grants.length} total entries · ${new Date().toLocaleString()}`;
  }catch(e){
    document.getElementById('msg').style.display='none';
    const el=document.getElementById('err');el.style.display='block';
    el.textContent='Error: '+e.message;
  }
}
load();
</script>
</body>
</html>
