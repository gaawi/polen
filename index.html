// ── Spreadsheet Editor with resizable columns ──
function EditSheet({data,setData,search}){
  const[sortCol,setSortCol]=useState('foundation');
  const[sortDir,setSortDir]=useState('asc');
  const[colWidths,setColWidths]=useState({
    id:35,foundation:170,grant:150,projectDates:120,deadline:100,deadlineType:70,season:70,nextStep:78,currency:55,amount:85,amountReceived:85,eligiblePeriodStart:90,eligiblePeriodEnd:90,reportDeadline:95,source:55,web:120,bases:120,notes:140,del:28
  });
  const resizing=useRef(null);

  useEffect(()=>{
    const onMove=e=>{
      if(!resizing.current)return;
      const{col,startX,startW}=resizing.current;
      const diff=e.clientX-startX;
      setColWidths(prev=>({...prev,[col]:Math.max(40,startW+diff)}));
    };
    const onUp=()=>{resizing.current=null;document.body.style.cursor='';};
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  },[]);

  const startResize=(col,e)=>{
    e.stopPropagation();
    e.preventDefault();
    resizing.current={col,startX:e.clientX,startW:colWidths[col]};
    document.body.style.cursor='col-resize';
  };

  const rows=useMemo(()=>{
    let r=[...data];
    if(search){const q=search.toLowerCase();r=r.filter(g=>g.foundation.toLowerCase().includes(q)||(g.grant||'').toLowerCase().includes(q)||(g.notes||'').toLowerCase().includes(q)||(g.projectDates||'').toLowerCase().includes(q));}
    r.sort((a,b)=>{
      let va,vb;
      if(sortCol==='deadline'||sortCol==='eligiblePeriodStart'||sortCol==='eligiblePeriodEnd'||sortCol==='reportDeadline'){va=a[sortCol]||'';vb=b[sortCol]||'';}
      else if(sortCol==='amount'||sortCol==='amountReceived'){va=a[sortCol]||0;vb=b[sortCol]||0;}
      else{va=(a[sortCol]||'').toLowerCase?.()??a[sortCol]??'';vb=(b[sortCol]||'').toLowerCase?.()??b[sortCol]??'';}
      if(va<vb)return sortDir==='asc'?-1:1;
      if(va>vb)return sortDir==='asc'?1:-1;
      return 0;
    });
    return r;
  },[data,search,sortCol,sortDir]);

  const upd=(id,key,val)=>{
    setData(prev=>prev.map(g=>g.id===id?{...g,[key]:val}:g));
  };
  // Helper: update eligiblePeriod from start/end dates
  const updPeriod=(id,which,val)=>{
    setData(prev=>prev.map(g=>{
      if(g.id!==id)return g;
      // Parse existing period to get start/end
      const parts=(g.eligiblePeriod||'').split(/\s*(?:–|—|to|-)\s*/);
      let startStr=parts[0]||'';
      let endStr=parts.length>1?parts[parts.length-1]:'';
      if(which==='start'){
        // Convert date input value to readable string
        if(val){const d=new Date(val+'T00:00:00');startStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}else startStr='';
      }else{
        if(val){const d=new Date(val+'T00:00:00');endStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}else endStr='';
      }
      const newPeriod=startStr&&endStr?`${startStr} – ${endStr}`:startStr||endStr;
      return {...g,eligiblePeriod:newPeriod};
    }));
  };
  // Parse eligiblePeriod to get start/end dates for input
  const parsePeriodDates=(period)=>{
    if(!period)return{start:'',end:''};
    const pts=period.split(/\s*(?:–|—|to|-)\s*/);
    const toISO=(s)=>{const d=pDate(s);return d?toLocalISO(d):''};
    return{start:toISO(pts[0]||''),end:pts.length>1?toISO(pts[pts.length-1]):''}
  };
  const del=(id)=>{
    if(confirm('Delete this entry?'))setData(prev=>prev.filter(g=>g.id!==id));
  };
  const doSort=c=>{if(sortCol===c)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortCol(c);setSortDir('asc');}};
  const AR=({c})=><span style={{marginLeft:2,opacity:sortCol===c?1:.3,fontSize:7}}>{sortCol===c?(sortDir==='asc'?'▲':'▼'):'↕'}</span>;
  const RH=({col})=><div className="col-resize" onMouseDown={e=>startResize(col,e)}/>;

  return(
    <div className="sheet-wrap">
      <table className="sheet">
        <thead><tr>
          <th style={{width:colWidths.id}}>#</th>
          <th onClick={()=>doSort('foundation')} className={sortCol==='foundation'?'so':''} style={{width:colWidths.foundation}}>Foundation <AR c="foundation"/><RH col="foundation"/></th>
          <th onClick={()=>doSort('grant')} className={sortCol==='grant'?'so':''} style={{width:colWidths.grant}}>Grant Program <AR c="grant"/><RH col="grant"/></th>
          <th onClick={()=>doSort('projectDates')} className={sortCol==='projectDates'?'so':''} style={{width:colWidths.projectDates}}>Project <AR c="projectDates"/><RH col="projectDates"/></th>
          <th onClick={()=>doSort('deadline')} className={sortCol==='deadline'?'so':''} style={{width:colWidths.deadline}}>Deadline <AR c="deadline"/><RH col="deadline"/></th>
          <th style={{width:colWidths.deadlineType}}>Type<RH col="deadlineType"/></th>
          <th onClick={()=>doSort('season')} className={sortCol==='season'?'so':''} style={{width:colWidths.season}}>Season <AR c="season"/><RH col="season"/></th>
          <th onClick={()=>doSort('nextStep')} className={sortCol==='nextStep'?'so':''} style={{width:colWidths.nextStep}}>Status <AR c="nextStep"/><RH col="nextStep"/></th>
          <th style={{width:colWidths.currency}}>Cur<RH col="currency"/></th>
          <th onClick={()=>doSort('amount')} className={sortCol==='amount'?'so':''} style={{width:colWidths.amount}}>Requested <AR c="amount"/><RH col="amount"/></th>
          <th onClick={()=>doSort('amountReceived')} className={sortCol==='amountReceived'?'so':''} style={{width:colWidths.amountReceived}}>Received <AR c="amountReceived"/><RH col="amountReceived"/></th>
          <th style={{width:colWidths.eligiblePeriodStart}}>Period Start<RH col="eligiblePeriodStart"/></th>
          <th style={{width:colWidths.eligiblePeriodEnd}}>Period End<RH col="eligiblePeriodEnd"/></th>
          <th onClick={()=>doSort('reportDeadline')} className={sortCol==='reportDeadline'?'so':''} style={{width:colWidths.reportDeadline}}>Report DL <AR c="reportDeadline"/><RH col="reportDeadline"/></th>
          <th style={{width:colWidths.source}} title="Upcoming = tracked. Past = historical.">Track<RH col="source"/></th>
          <th style={{width:colWidths.web}}>Link<RH col="web"/></th>
          <th style={{width:colWidths.bases}}>Bases PDF<RH col="bases"/></th>
          <th style={{width:colWidths.notes}}>Notes<RH col="notes"/></th>
          <th style={{width:colWidths.del}}></th>
        </tr></thead>
        <tbody>
          {rows.map((g,i)=>{
            const pd=parsePeriodDates(g.eligiblePeriod);
            return(
            <tr key={g.id}>
              <td className="cell-id">{i+1}</td>
              <td className="cell-found"><textarea value={g.foundation} onChange={e=>upd(g.id,'foundation',e.target.value)} rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
              <td><textarea value={g.grant||''} onChange={e=>upd(g.id,'grant',e.target.value)} placeholder="—" rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
              <td><textarea value={g.projectDates||''} onChange={e=>upd(g.id,'projectDates',e.target.value)} placeholder="Project name" rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
              <td className="cell-date" onClick={ev=>{const inp=ev.currentTarget.querySelector('input');if(inp)inp.showPicker?.();}}><span className="date-disp">{g.deadline?fmtDate(g.deadline):'—'}</span><input type="date" value={g.deadline||''} onChange={e=>upd(g.id,'deadline',e.target.value)} className="date-hidden"/></td>
              <td><select value={g.deadlineType||'Estimated'} onChange={e=>upd(g.id,'deadlineType',e.target.value)}><option value="DDLNE!">Hard</option><option value="Estimated">Est.</option></select></td>
              <td><select value={g.season||''} onChange={e=>upd(g.id,'season',e.target.value)} style={{fontSize:9}}><option value="">—</option><option value="Spring">Spring</option><option value="Summer">Summer</option><option value="Fall">Fall</option><option value="Winter">Winter</option><option value="Closed">Closed</option></select></td>
              <td><select value={g.nextStep} onChange={e=>upd(g.id,'nextStep',e.target.value)} style={{fontSize:9}}>{STEPS.map(st=><option key={st} value={st}>{STEP_SHORT[st]}</option>)}</select></td>
              <td><select value={g.currency||'USD'} onChange={e=>upd(g.id,'currency',e.target.value)} style={{fontSize:10}}><option value="USD">$</option><option value="EUR">€</option></select></td>
              <td className="cell-amt"><input type="number" value={g.amount||''} onChange={e=>upd(g.id,'amount',e.target.value?parseFloat(e.target.value):null)} placeholder="—"/></td>
              <td className="cell-amt"><input type="number" value={g.amountReceived||''} onChange={e=>upd(g.id,'amountReceived',e.target.value?parseFloat(e.target.value):null)} placeholder="—"/></td>
              <td className="cell-date" onClick={ev=>{const inp=ev.currentTarget.querySelector('input');if(inp)inp.showPicker?.();}}><span className="date-disp">{pd.start?fmtDate(pd.start):'—'}</span><input type="date" value={pd.start} onChange={e=>updPeriod(g.id,'start',e.target.value)} className="date-hidden"/></td>
              <td className="cell-date" onClick={ev=>{const inp=ev.currentTarget.querySelector('input');if(inp)inp.showPicker?.();}}><span className="date-disp">{pd.end?fmtDate(pd.end):'—'}</span><input type="date" value={pd.end} onChange={e=>updPeriod(g.id,'end',e.target.value)} className="date-hidden"/></td>
              <td className="cell-date" onClick={ev=>{const inp=ev.currentTarget.querySelector('input');if(inp)inp.showPicker?.();}}><span className="date-disp">{g.reportDeadline?fmtDate(g.reportDeadline):'—'}</span><input type="date" value={g.reportDeadline||''} onChange={e=>upd(g.id,'reportDeadline',e.target.value)} className="date-hidden"/></td>
              <td><select value={g.source||'historical'} onChange={e=>upd(g.id,'source',e.target.value)} style={{fontSize:9}}><option value="calendar">Up</option><option value="historical">Past</option></select></td>
              <td><textarea value={g.web||''} onChange={e=>upd(g.id,'web',e.target.value)} placeholder="https://..." rows={1} style={{fontSize:10}} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
              <td><textarea value={g.bases||''} onChange={e=>upd(g.id,'bases',e.target.value)} placeholder="https://...pdf" rows={1} style={{fontSize:10}} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
              <td><textarea value={g.notes||''} onChange={e=>upd(g.id,'notes',e.target.value)} placeholder="—" rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
              <td className="cell-del"><button onClick={()=>del(g.id)} title="Delete"><i className="fa-solid fa-xmark"/></button></td>
            </tr>
          );})}
        </tbody>
      </table>
    </div>
  );
}

        }
      </div>
      <div className="sugg-actions">
        {web&&<a href={web} target="_blank" rel="noreferrer" className="sugg-link-btn" onClick={e=>e.stopPropagation()}><i className="fa-solid fa-arrow-up-right-from-square"/> Link</a>}
        <button className="btn btn-pri sugg-btn-accept" onClick={()=>onAccept(enriched)}><i className="fa-solid fa-check"/> Accept</button>
        <button className="btn btn-sec sugg-btn-rej" onClick={()=>onReject(s.id)}><i className="fa-solid fa-xmark"/></button>
      </div>
    </div>
  );
}
// ── Month Calendar View ──
function MonthCalendar({data,onClickGrant,todayRef}){
  const today=useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d;},[]);
  const[todayVisible,setTodayVisible]=React.useState(true);
  useEffect(()=>{
    const el=todayRef?.current;
    if(!el)return;
    const obs=new IntersectionObserver(([e])=>setTodayVisible(e.isIntersecting),{threshold:0});
    obs.observe(el);
    return()=>obs.disconnect();
  },[todayRef?.current]);
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MO3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS_HDR=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  // Build a single continuous list of weeks (no per-month grids → no repeated days)
  const weeks=useMemo(()=>{
    // Start: Monday of the week that contains (today - 4 months)
    const rangeStart=new Date(2001,0,1);
    const dow=(rangeStart.getDay()+6)%7;
    const cursor=new Date(rangeStart);
    cursor.setDate(cursor.getDate()-dow);
    // End: 24 months from rangeStart
    const rangeEnd=new Date(today.getFullYear(),today.getMonth()+20,1);
    const arr=[];
    while(cursor<rangeEnd){
      const week=[];
      for(let d=0;d<7;d++){week.push(new Date(cursor));cursor.setDate(cursor.getDate()+1);}
      arr.push(week);
    }
    return arr;
  },[today]);

  const byDate=useMemo(()=>{
    const m={};
    data.forEach(g=>{if(!g.deadline)return;if(!m[g.deadline])m[g.deadline]=[];m[g.deadline].push(g);});
    return m;
  },[data]);

  const fmtKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const chipCls=s=>{
    if(s==='05 Received')return'mcal-chip-green';
    if(s==='04 Denied'||s==='07 Missed Deadline'||s==='01 Apply on deadline'||s==='00 Send Proposal')return'mcal-chip-red';
    if(s==='03 Waiting Results')return'mcal-chip-blue';
    if(s==='02 Check')return'mcal-chip-yellow';
    return'mcal-chip-gray';
  };

  useEffect(()=>{todayRef?.current?.scrollIntoView({behavior:'instant',block:'start'});},[]);

  return(
    <div className="mcal-wrap">
      <div className="mcal-sticky-hdrs">
        {DAYS_HDR.map(d=><div key={d} className="mcal-day-hdr">{d}</div>)}
      </div>
      <div className="mcal-scroll">
        {weeks.map((week,wi)=>{
          const isTodayWeek=week.some(d=>d.getTime()===today.getTime());
          const MAX=4;
          const weekChips=[];
          week.forEach((d,di)=>{
            const grants=byDate[fmtKey(d)]||[];
            grants.slice(0,MAX).forEach(g=>weekChips.push({di,g}));
            if(grants.length>MAX)weekChips.push({di,g:null,extra:grants.length-MAX});
          });
          return(
            <div key={wi} className="mcal-week-row" ref={isTodayWeek?todayRef:null}>
              {(()=>{
                const bi=week.findIndex(d=>d.getDate()===1);
                const hasMo=bi>=0;
                const moLbl=hasMo?(MONTHS[week[bi].getMonth()]+(week[bi].getMonth()===0?` ${week[bi].getFullYear()}`:'')):null;
                return <React.Fragment>
                  <div className="mcal-days-layer">
                    {week.map((d,di)=>{
                      const isToday=d.getTime()===today.getTime();
                      const isWeekend=d.getDay()===0||d.getDay()===6;
                      const moEnd=hasMo&&bi>0&&di<bi;
                      const moStart=hasMo&&di===bi;
                      const moAfter=hasMo&&di>bi;
                      return(
                        <div key={di} className={`mcal-cell${isWeekend?' weekend':''}${isToday?' today':''}${moEnd?' mo-end':''}${moStart?' mo-start':''}${moAfter?' mo-after':''}`}>
                          <span className="mcal-dn">{d.getDate()}</span>
                          {isToday&&<span className="mcal-today-lbl">today</span>}
                        </div>
                      );
                    })}
                  </div>
                  {hasMo&&<div className="mcal-mo-sep"><span className="mcal-mo-sep-lbl">{moLbl}</span></div>}
                </React.Fragment>;
              })()}
              <div className="mcal-chips-layer">
                {weekChips.map(({di,g,extra},i)=>{
                  const colStart=di+1;
                  const colEnd=Math.min(di+3,8);
                  if(g===null)return(
                    <div key={i} className="mcal-chip mcal-chip-more"
                      style={{gridColumnStart:colStart,gridColumnEnd:colEnd}}>+{extra}</div>
                  );
                  const isUrgent=g.nextStep==='01 Apply on deadline'||g.nextStep==='00 Send Proposal';
                  return(
                    <div key={i}
                      className={`mcal-chip ${chipCls(g.nextStep)}${isUrgent?' mcal-chip-urgent':''}`}
                      style={{gridColumnStart:colStart,gridColumnEnd:colEnd}}
                      title={[g.foundation,g.grant,g.projectDates].filter(Boolean).join(' · ')}
                      onClick={()=>onClickGrant(g)}>
                      {isUrgent&&<span className="mcal-chip-warn-ico"/>}
                      <span className="mcal-chip-txt">{g.foundation||g.grant||'—'}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      <button
        className={`mcal-today-float${todayVisible?' hidden':''}`}
        onClick={()=>todayRef?.current?.scrollIntoView({behavior:'smooth',block:'start'})}>
        Today
      </button>
    </div>
  );
}

// ── APP ──
function App({initialGrants}){
  const[data,setData]=useState(()=>initialGrants.map(g=>({...g})));
  const[saveMsg,setSaveMsg]=useState(null);
  const[lastSaved,setLastSaved]=useState(null);
  const[saveStatus,setSaveStatus]=useState('ok'); // ok, local, err
  const[search,setSearch]=useState('');
  const[statusFilter,setStatusFilter]=useState('all');
  const[showAdd,setShowAdd]=useState(false);
  const[addPrefill,setAddPrefill]=useState(null);
  const[editMode,setEditMode]=useState(false);
  const[activeView,setActiveView]=useState(false); // "Active Grants" view
  const[calendarView,setCalendarView]=useState(false); // "Upcoming/Calendar" view
  const[monthView,setMonthView]=useState(false); // Google-calendar style month view
  const[calModalId,setCalModalId]=useState(null); // month calendar event modal
  const calTodayRef=useRef(null);
  const[isDark,setIsDark]=useState(()=>localStorage.getItem('polen-theme')==='dark');
  const[suggestions,setSuggestions]=useState([]);
  const[showSuggestions,setShowSuggestions]=useState(false);
  const[suggView,setSuggView]=useState(false);
  const[showTasks,setShowTasks]=useState(false);
  useEffect(()=>{document.documentElement.classList.toggle('light',!isDark);},[isDark]);
  useEffect(()=>{loadSuggestions().then(setSuggestions);},[]);

  // Auto-save: localStorage instantly + server after 2s debounce
  const saveTimer=useRef(null);
  const firstRender=useRef(true);
  useEffect(()=>{
    if(firstRender.current){firstRender.current=false;return;}
    setLastSaved(new Date());
    setSaveStatus('saving');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      const r=await saveToServer(data);
      if(r.ok){setSaveStatus('ok');setLastSaved(new Date());setSaveMsg(null);}
      else{setSaveStatus('local');setSaveMsg(r.msg);}
    },2000);
    return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);};
  },[data]);

  // Group entries by grant program (foundation + grant combo)
  const programGroups=useMemo(()=>{
    // Group ALL entries first — status filter applied at group level so full history is visible when expanded
    const groups={};
    data.forEach(g=>{
      const key=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();
      if(!groups[key])groups[key]={key,foundation:(g.foundation||'').trim(),grant:(g.grant||'').trim(),entries:[]};
      groups[key].entries.push(g);
    });
    const now=new Date();now.setHours(0,0,0,0);
    // For each group, compute stats and find next deadline
    let result=Object.values(groups).map(grp=>{
      grp.entries.sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||'')); // newest first
      const futureEntries=grp.entries.filter(e=>e.deadline&&new Date(e.deadline+'T00:00:00')>=now).sort((a,b)=>a.deadline.localeCompare(b.deadline));
      grp.nextDeadline=futureEntries[0]||null;
      grp.primary=grp.entries[0];
      grp.received=grp.entries.filter(e=>e.nextStep==='05 Received').length;
      grp.denied=grp.entries.filter(e=>e.nextStep==='04 Denied').length;
      grp.waiting=grp.entries.filter(e=>e.nextStep==='03 Waiting Results').length;
      grp.totalAmtByCur={};
      grp.entries.filter(e=>e.nextStep==='05 Received').forEach(e=>{const c=e.currency||'USD';grp.totalAmtByCur[c]=(grp.totalAmtByCur[c]||0)+(e.amountReceived||e.amount||0);});
      grp.totalAmt=Object.values(grp.totalAmtByCur).reduce((s,v)=>s+v,0);
      return grp;
    });
    // Filter groups by status of their most recent (primary) entry
    if(statusFilter==='apply')result=result.filter(grp=>grp.primary.nextStep==='01 Apply on deadline'||grp.primary.nextStep==='00 Send Proposal');
    else if(statusFilter!=='all')result=result.filter(grp=>grp.primary.nextStep===statusFilter);
    // Search: match any entry's foundation, grant, notes, or projectDates
    if(search){
      const q=search.toLowerCase();
      result=result.filter(grp=>(grp.foundation||'').toLowerCase().includes(q)||(grp.grant||'').toLowerCase().includes(q)||grp.entries.some(e=>(e.notes||'').toLowerCase().includes(q)||(e.projectDates||'').toLowerCase().includes(q)));
    }
    return result.sort((a,b)=>{
      // Groups with future deadlines first (soonest), then past (most recent)
      const aD=a.nextDeadline?a.nextDeadline.deadline:'9999';
      const bD=b.nextDeadline?b.nextDeadline.deadline:'9999';
      const aFut=a.nextDeadline&&new Date(aD+'T00:00:00')>=now;
      const bFut=b.nextDeadline&&new Date(bD+'T00:00:00')>=now;
      if(aFut&&!bFut)return -1;
      if(!aFut&&bFut)return 1;
      if(aFut&&bFut)return aD.localeCompare(bD);
      // Both past: most recent first
      const aR=a.primary.deadline||'';
      const bR=b.primary.deadline||'';
      return bR.localeCompare(aR);
    });
  },[data,statusFilter,search]);

  // Active Grants: awarded + currently within grant period
  const activeGrants=useMemo(()=>{
    const now=new Date();
    return data.filter(g=>{
      if(g.nextStep!=='05 Received')return false;
      const p=pPeriod(g.eligiblePeriod);
      if(!p)return false; // no period = can't determine if active
      return now>=p.start&&now<=p.end;
    }).sort((a,b)=>{
      // Sort by period end date (soonest ending first)
      const pa=pPeriod(a.eligiblePeriod), pb=pPeriod(b.eligiblePeriod);
      return(pa?pa.end:new Date('9999'))-(pb?pb.end:new Date('9999'));
    });
  },[data]);

  const activeGroups=useMemo(()=>{
    const groups={};
    activeGrants.forEach(g=>{
      const key=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();
      if(!groups[key])groups[key]={key,foundation:(g.foundation||'').trim(),grant:(g.grant||'').trim(),entries:[]};
      groups[key].entries.push(g);
    });
    return Object.values(groups).map(grp=>{
      grp.entries.sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||''));
      grp.primary=grp.entries[0];
      grp.nextDeadline=grp.entries.find(e=>e.deadline&&new Date(e.deadline+'T00:00:00')>=new Date())||grp.primary;
      grp.received=grp.entries.filter(e=>e.nextStep==='05 Received').length;
      grp.denied=grp.entries.filter(e=>e.nextStep==='04 Denied').length;
      grp.waiting=grp.entries.filter(e=>e.nextStep==='03 Waiting Results').length;
      grp.totalAmtByCur={};
      grp.entries.filter(e=>e.nextStep==='05 Received').forEach(e=>{const c=e.currency||'USD';grp.totalAmtByCur[c]=(grp.totalAmtByCur[c]||0)+(e.amountReceived||e.amount||0);});
      grp.totalAmt=Object.values(grp.totalAmtByCur).reduce((s,v)=>s+v,0);
      return grp;
    }).sort((a,b)=>{
      const pa=pPeriod(a.primary.eligiblePeriod), pb=pPeriod(b.primary.eligiblePeriod);
      return(pa?pa.end:new Date('9999'))-(pb?pb.end:new Date('9999'));
    });
  },[activeGrants]);

  // Calendar view: only shows grant programs that have an explicit season field
  const calendarData=useMemo(()=>{
    const SEASONS=[
      {key:'Spring',name:'Spring',emoji:'🌱'},
      {key:'Summer',name:'Summer',emoji:'☀️'},
      {key:'Fall',name:'Fall',emoji:'🍂'},
      {key:'Winter',name:'Winter',emoji:'❄️'},
      {key:'Closed',name:'Closed',emoji:'🚫'}
    ];
    const seasonKeyToIdx={Spring:0,Summer:1,Fall:2,Winter:3,Closed:4};
    const monthToSeason=m=>m>=2&&m<=4?0:m>=5&&m<=7?1:m>=8&&m<=10?2:3;
    const curYear=new Date().getFullYear();
    // Build program map — only include entries that have a season field
    const progMap={};
    data.forEach(g=>{
      const hasSeason=g.season&&seasonKeyToIdx[g.season]!==undefined;
      const key=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();
      // Initialize program if any entry of it has a season
      if(hasSeason&&!progMap[key])progMap[key]={foundation:(g.foundation||'').trim(),grant:(g.grant||'').trim(),entries:[],web:g.web||'',bases:g.bases||'',season:g.season};
      // If program already exists (season was set on another entry), also collect this entry for history
      if(progMap[key]){
        if(g.deadline){
          const d=new Date(g.deadline+'T00:00:00');
          progMap[key].entries.push({month:d.getMonth(),day:d.getDate(),year:d.getFullYear(),status:g.nextStep,amount:g.amountReceived||g.amount||0,deadline:g.deadline,deadlineType:g.deadlineType||''});
        }
        if(g.web&&!progMap[key].web)progMap[key].web=g.web;
        if(g.bases&&!progMap[key].bases)progMap[key].bases=g.bases;
        if(hasSeason)progMap[key].season=g.season;
      }
    });
    const bySeason=[[],[],[],[],[]];
    Object.values(progMap).forEach(prog=>{
      if(!prog.season||seasonKeyToIdx[prog.season]===undefined)return;
      const si=seasonKeyToIdx[prog.season];
      const received=prog.entries.filter(e=>e.status==='05 Received').length;
      const totalApps=prog.entries.length;
      const rate=totalApps>0?Math.round(received/totalApps*100):0;
      const totalAmt=prog.entries.filter(e=>e.status==='05 Received').reduce((s,e)=>s+e.amount,0);
      const history=prog.entries.slice().sort((a,b)=>a.year-b.year||a.month-b.month);
      const thisYearEntries=prog.entries.filter(e=>e.year===curYear);
      const trackedStatuses=['01 Apply on deadline','00 Send Proposal','03 Waiting Results','05 Received','04 Denied','08 Not Eligible'];
      const isTracked=thisYearEntries.some(e=>trackedStatuses.includes(e.status));
      // Skip if already tracked this year (apply/waiting/received/denied)
      if(isTracked)return;
      // Compute last known deadline for reference
      const lastEntry=history.length>0?history[history.length-1]:null;
      const lastDeadline=lastEntry?lastEntry.deadline:null;
      const lastDLType=lastEntry?lastEntry.deadlineType:'';
      const lastMonth=lastEntry?lastEntry.month:null;
      const lastDay=lastEntry?lastEntry.day:null;
      const lastYear=lastEntry?lastEntry.year:null;
      // Estimated next deadline based on historical avg
      const avgMonth=lastMonth;
      const avgDay=lastDay;
      bySeason[si].push({
        foundation:prog.foundation,grant:prog.grant,web:prog.web,
        totalApps,received,rate,totalAmt,history,
        lastDeadline,lastDLType,lastMonth,lastDay,lastYear,avgMonth,avgDay
      });
    });
    bySeason.forEach(arr=>arr.sort((a,b)=>(a.foundation||'').localeCompare(b.foundation||'')));
    const now=new Date();
    const curSeason=monthToSeason(now.getMonth());
    const result=[];
    for(let i=0;i<4;i++){
      const si=(curSeason+i)%4;
      const s=SEASONS[si];
      if(bySeason[si].length>0){
        result.push({...s,isCurrent:si===curSeason,isNext:si===(curSeason+1)%4,grants:bySeason[si]});
      }
    }
    // Closed always at the end
    if(bySeason[4].length>0){
      result.push({...SEASONS[4],isCurrent:false,isNext:false,grants:bySeason[4]});
    }
    return result;
  },[data]);

  const stats=useMemo(()=>({
    total:data.length,
    apply:data.filter(g=>g.nextStep==='01 Apply on deadline'||g.nextStep==='00 Send Proposal').length,
    waiting:data.filter(g=>g.nextStep==='03 Waiting Results').length,
    waitingAmtByCur:(()=>{const m={};data.filter(g=>g.nextStep==='03 Waiting Results').forEach(g=>{const c=g.currency||'USD';m[c]=(m[c]||0)+(g.amount||0);});return m;})(),
    received:data.filter(g=>g.nextStep==='05 Received').length,
    denied:data.filter(g=>g.nextStep==='04 Denied').length,
    active:activeGrants.length,
    totalAmt:data.filter(g=>g.nextStep==='05 Received').reduce((s,g)=>s+(g.amountReceived||g.amount||0),0),
    activeAmt:activeGrants.reduce((s,g)=>s+(g.amountReceived||g.amount||0),0),
  }),[data,activeGrants]);

  const changeStatus=useCallback((id,newStep)=>setData(p=>p.map(g=>g.id===id?{...g,nextStep:newStep}:g)),[]);
  const changeField=useCallback((id,field,val)=>setData(p=>p.map(g=>g.id===id?{...g,[field]:val}:g)),[]);
  const changeProgramSeason=useCallback((foundation,grant,newSeason)=>{
    const f=(foundation||'').trim(), gr=(grant||'').trim();
    setData(p=>p.map(g=>(g.foundation||'').trim()===f&&(g.grant||'').trim()===gr?{...g,season:newSeason}:g));
  },[]);
  const add=useCallback(g=>setData(p=>[g,...p]),[]);
  const delEntry=useCallback(id=>{if(confirm('Delete this grant entry?'))setData(p=>p.filter(g=>g.id!==id));},[]);
  const dupEntry=useCallback(id=>{setData(p=>{const src=p.find(g=>g.id===id);if(!src)return p;const copy={...src,id:Date.now(),notes:(src.notes||'')+' (copy)'};return[copy,...p];});},[]);
  const[expRow,setExpRow]=useState(null);

  const toggleTask=useCallback((entryId,taskId)=>setData(p=>p.map(g=>g.id===entryId?{...g,tasks:(g.tasks||[]).map(t=>t.id===taskId?{...t,done:!t.done}:t)}:g)),[]);
  // All pending tasks across grants, sorted by deadline (no-deadline last)
  const allPendingTasks=useMemo(()=>{
    const out=[];
    data.forEach(en=>(en.tasks||[]).forEach(t=>{if(!t.done)out.push({task:t,entry:en});}));
    out.sort((a,b)=>(a.task.deadline||'9999-99').localeCompare(b.task.deadline||'9999-99'));
    return out;
  },[data]);
  const calModalEntry=calModalId?data.find(g=>g.id===calModalId):null;
  useEffect(()=>{
    if(!calModalId)return;
    const h=e=>{if(e.key==='Escape')setCalModalId(null);};
    document.addEventListener('keydown',h);
    return()=>document.removeEventListener('keydown',h);
  },[calModalId]);

  return(
    <div className="app">
      {calModalEntry&&(
        <div className="gmodal-ov" onClick={()=>setCalModalId(null)}>
          <div className="gmodal" onClick={ev=>ev.stopPropagation()}>
            <button className="gmodal-close" onClick={()=>setCalModalId(null)} title="Close"><i className="fa-solid fa-xmark"/></button>
            <AppEntry e={calModalEntry} isLast={true}
              onChangeStatus={changeStatus}
              onChangeField={changeField}
              onDelete={()=>{delEntry(calModalEntry.id);setCalModalId(null);}}
              onDuplicate={()=>dupEntry(calModalEntry.id)}/>
          </div>
        </div>
      )}
      {showTasks&&(
        <React.Fragment>
          <div className="tpanel-ov" onClick={()=>setShowTasks(false)}/>
          <div className="tpanel">
            <div className="tpanel-hdr">
              <span className="tpanel-title"><i className="fa-solid fa-list-check" style={{color:'var(--o)'}}/> Tasks <span style={{fontSize:12,color:'var(--tf)',fontWeight:600}}>{allPendingTasks.length}</span></span>
              <button className="gmodal-close" style={{position:'static'}} onClick={()=>setShowTasks(false)} title="Close"><i className="fa-solid fa-xmark"/></button>
            </div>
            <div className="tpanel-body">
              {allPendingTasks.length===0?(
                <div className="tpanel-empty"><i className="fa-solid fa-check" style={{fontSize:28,color:'var(--g)',display:'block',marginBottom:10}}/>No pending tasks. All clear!</div>
              ):allPendingTasks.map(({task,entry})=>(
                <div key={task.id} className="tpanel-task" onClick={()=>{setCalModalId(entry.id);setShowTasks(false);}}>
                  <button className={`task-chk${task.done?' done':''}`} onClick={ev=>{ev.stopPropagation();toggleTask(entry.id,task.id);}} title="Mark done">{task.done&&<i className="fa-solid fa-check"/>}</button>
                  <div className="tpanel-task-body">
                    <div className="tpanel-task-text">{task.text}</div>
                    <div className="tpanel-task-sub">{entry.foundation||'—'}{entry.grant?` · ${entry.grant}`:''}</div>
                  </div>
                  {task.deadline&&<span className={`task-dl ${taskCls(task.deadline)}`} style={{alignSelf:'center'}}>{taskRel(task.deadline)}</span>}
                </div>
              ))}
            </div>
          </div>
        </React.Fragment>
      )}
      <div className="topbar">
        <span className="nav-brand"><PolenLogo size={22}/> POLEN</span>
        <div style={{flex:1}}/>
        <div className="topbar-actions">

      <div className="filters">

            </button>

          {/* Mobile: dropdown */}
          <div className={`chip-sel-wrap status-sel-mobile${statusFilter!=='all'&&!editMode&&!activeView&&!calendarView&&!monthView&&!suggView?' active':''}`}>

              <option value="04 Denied">Denied ({stats.denied})</option>

          </div>
          <button className={`chip ${activeView&&!editMode&&!calendarView&&!monthView&&!suggView?'on':''}`} onClick={()=>{setActiveView(!activeView);setEditMode(false);setCalendarView(false);setMonthView(false);setSuggView(false);setExpRow(null);}} style={activeView?{background:'var(--gbg)',color:'var(--g)'}:{}}><i className="fa-solid fa-bolt"/> Active ({stats.active})</button>
          <button className={`chip ${calendarView&&!editMode&&!monthView&&!suggView?'on':''}`} onClick={()=>{setCalendarView(!calendarView);setEditMode(false);setActiveView(false);setMonthView(false);setSuggView(false);setExpRow(null);}} style={calendarView?{background:'var(--obg)',color:'var(--o)'}:{}}><i className="fa-solid fa-calendar-days"/> Upcoming{calendarData.reduce((s,m)=>s+m.grants.length,0)>0&&<span style={{marginLeft:5,background:'var(--o)',color:'#fff',borderRadius:10,padding:'0 6px',fontSize:10,fontWeight:800}}>{calendarData.reduce((s,m)=>s+m.grants.length,0)}</span>}</button>
          <button className={`chip ${suggView?'on':''}`} onClick={()=>{setSuggView(v=>!v);setEditMode(false);setActiveView(false);setCalendarView(false);setMonthView(false);setExpRow(null);}} style={suggView?{background:'var(--bbg)',color:'var(--b)'}:{}}>
            <i className="fa-solid fa-robot"/> IA{suggestions.length>0&&<span style={{marginLeft:5,background:'var(--r)',color:'#fff',borderRadius:10,padding:'0 6px',fontSize:10,fontWeight:800}}>{suggestions.length}</span>}
          </button>
        </div>
        <span style={{fontSize:11,color:'var(--tf)',marginLeft:'auto',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {editMode?`${data.length} entries`:suggView?`${suggestions.length} sugerencias IA pendientes`:monthView?'':calendarView?`${calendarData.reduce((s,m)=>s+m.grants.length,0)} programs · ${calendarData.length} seasons`:activeView?`${activeGroups.length} programs · ${activeGrants.length} active grants`:(()=>{
            const curYr=new Date().getFullYear().toString();
            const reqByCur={};
            if(statusFilter==='03 Waiting Results'){
              programGroups.forEach(g=>{
                const e=g.entries.find(e=>e.deadline&&e.deadline.startsWith(curYr))||g.primary;
                if(e.amount){const c=e.currency||'USD';reqByCur[c]=(reqByCur[c]||0)+e.amount;}
              });
            } else {
              programGroups.forEach(g=>{if(g.primary.amount){const c=g.primary.currency||'USD';reqByCur[c]=(reqByCur[c]||0)+g.primary.amount;}});
            }
            const wonByCur={};programGroups.forEach(g=>Object.entries(g.totalAmtByCur).forEach(([c,v])=>{wonByCur[c]=(wonByCur[c]||0)+v;}));
            const reqStr=fmtByCur(reqByCur)!=='—'?fmtByCur(reqByCur):'';
            const wonStr=fmtByCur(wonByCur)!=='—'?fmtByCur(wonByCur):'';
            return <>{`${programGroups.length} programs · ${programGroups.reduce((s,g)=>s+g.entries.length,0)} grants`}{reqStr&&<span style={{borderLeft:'1px solid var(--bd)',paddingLeft:8}}>{statusFilter==='03 Waiting Results'?`${curYr} req`:' req'} <strong style={{color:'var(--td)'}}>{reqStr}</strong></span>}{wonStr&&statusFilter!=='03 Waiting Results'&&<span>· won <strong style={{color:'var(--g)'}}>{wonStr}</strong></span>}</>;
          })()}

        </span>
      </div>

      <div className="main-area">

          <SuggestionsView suggestions={suggestions} onAccept={s=>acceptSuggestion(s,add,setSuggestions)} onReject={id=>rejectSuggestion(id,setSuggestions)}/>

          <MonthCalendar data={data} onClickGrant={g=>setCalModalId(g.id)} todayRef={calTodayRef}/>
        ):calendarView?(
          <div className="cal-view">
            {calendarData.length===0?(

              </div>

              <div key={se.name} className={`cal-season${se.key==='Closed'?' closed':''}`}>

                  const MSHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

                        </select>
                        <span className="cg-chevron">›</span>
                      </div>
                    </div>
                    {g.lastDeadline&&(
                      <div className="cg-meta">

                        <span className={`cg-dl-type ${g.lastDLType==='DDLNE!'?'hard':'est'}`}>{g.lastDLType==='DDLNE!'?'HARD':'EST'}</span>
                        {g.totalAmt>0&&<div className="cg-meta-item"><span className="label">Won</span> <span className="val" style={{color:'var(--g)'}}>{fmt(g.totalAmt)}</span></div>}
                      </div>

                    <div className="cg-bottom">
                      <div className="cg-history">
                        {g.history.map((h,hi)=>{
                          const cls=h.status==='05 Received'?'received':h.status==='04 Denied'?'denied':h.status==='03 Waiting Results'?'waiting':h.status==='07 Missed Deadline'?'missed':h.status==='08 Not Eligible'?'notelig':'check';
                          return <span key={hi} className="cg-yr"><span className={`sem-dot ${cls}`}/>{String(h.year).slice(-2)}</span>;
                        })}
                        <span className="cg-rate">{g.received}/{g.totalApps}</span>
                      </div>
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <a className="cg-search-btn" href={'https://www.google.com/search?q='+encodeURIComponent((g.foundation||'')+' '+(g.grant||'')+' grant '+new Date().getFullYear())} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} title="Search on Google">🔍</a>
                        {g.web&&<a className="cg-web-btn" href={g.web} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} title="Open website"><i className="fa-solid fa-arrow-up-right-from-square"/></a>}
                        <button className="cg-add-btn" onClick={e=>{e.stopPropagation();setAddPrefill({foundation:g.foundation,grant:g.grant,web:g.web||'',season:se.key});setShowAdd(true);}}>
                          + Add {new Date().getFullYear()}
                        </button>
                      </div>
                    </div>
                  </div>
                );})}
              </div>
            ))}
          </div>
        ):activeView?(
          activeGroups.length===0?(
            <div style={{textAlign:'center',padding:40,color:'var(--tf)'}}>No active grants with a defined grant period right now.</div>
          ):(

            {activeGroups.map(grp=>(
              <div key={grp.key} className="active-2col-group">
                <div className="active-2col-hdr">
                  <span className="active-2col-foundation">{grp.foundation}</span>
                  {grp.grant&&<span className="active-2col-grant">{grp.grant}</span>}
                  {grp.primary.projectDates&&<span className="active-2col-proj">{grp.primary.projectDates}</span>}
                  <span className="active-2col-count">{grp.entries.length} app{grp.entries.length>1?'s':''}</span>

                {grp.entries.slice().sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||'')).map(e=>(
                  <div key={e.id} className="entry-mini-row" onClick={()=>setCalModalId(e.id)}>

                      <div className="emr-top">
                        <span className="emr-year">{e.deadline?e.deadline.substring(0,4):'—'}</span>
                        <span className={`ns ${STEP_CSS[e.nextStep]||'ns-check'}`}>{STEP_SHORT[e.nextStep]||e.nextStep}</span>
                        {e.deadline&&<span className="emr-dl">{fmtDateShort(e.deadline)}</span>}
                        {(e.amountReceived||e.amount)&&<span className={`emr-amt-big${e.amountReceived?' received':''}`}>{fmt(e.amountReceived||e.amount,e.currency||'USD')}</span>}
                        {(()=>{const ti=pendingTaskInfo(e);return ti?<span className={`task-alert ${ti.cls}`} title={ti.nearest.text}><i className="fa-solid fa-triangle-exclamation"/>{ti.count} pending task{ti.count>1?'s':''}{ti.nearest.deadline?` · ${taskRel(ti.nearest.deadline)}`:''}</span>:null;})()}

                    </div>

                  </div>

              </div>
            ))}

              {programGroups.map(grp=>{

                const isExp=expRow===grp.key;
                const relStr=days<0?`${Math.abs(days)}d ago`:days===0?'Today':days<=60?`${days}d`:`${Math.round(days/30)}mo`;
                const latestStep=grp.primary.nextStep;
                const dType=nd?nd.deadlineType:'';
                const MO3X=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                const dlParts=nd&&nd.deadline?nd.deadline.split('-'):null;
                const dlMo=dlParts?MO3X[+dlParts[1]-1]:'';
                const dlDay=dlParts?+dlParts[2]:'';
                const dlYr=dlParts?("'"+dlParts[0].slice(2)):'';

                // Semáforo: year history dots
                const semEntries=grp.entries.slice().sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));

                const grpPendTasks=grp.entries.flatMap(en=>(en.tasks||[]).filter(t=>!t.done).map(t=>({...t,_eid:en.id})));
                const grpTaskNearest=grpPendTasks.filter(t=>t.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0]||grpPendTasks[0];
                const grpTaskCls=grpTaskNearest&&grpTaskNearest.deadline?taskCls(grpTaskNearest.deadline):'future';

                    {/* Line 3: Grant program + semáforo */}

                    <td className="desk-only"><span className={`ns ${STEP_CSS[latestStep]||'ns-check'}`}>{STEP_SHORT[latestStep]||latestStep}</span></td>
                    <td className="desk-only" style={{fontVariantNumeric:'tabular-nums',fontSize:11,color:'var(--td)'}}>{grp.primary.amount?fmt(grp.primary.amount,grp.primary.currency||'USD'):''}</td>
                    {statusFilter!=='03 Waiting Results'&&<td className="desk-only" style={{fontVariantNumeric:'tabular-nums',fontWeight:700,color:'var(--g)',fontSize:11}}>{grp.totalAmt>0?fmtByCur(grp.totalAmtByCur):''}</td>}
                    <td className="desk-only" style={{textAlign:'center'}}>
                      <div style={{display:'flex',gap:5,justifyContent:'center'}}>
                        {grp.primary.web&&<a href={grp.primary.web} target="_blank" rel="noreferrer" className="btn-icon btn-icon-web" onClick={e=>e.stopPropagation()} title="Ver Convocatoria"><i className="fa-solid fa-arrow-up-right-from-square"/></a>}
                        {grp.primary.bases&&<a href={grp.primary.bases} target="_blank" rel="noreferrer" className="btn-icon btn-icon-pdf" onClick={e=>e.stopPropagation()} title="Ver Bases (PDF)"><i className="fa-solid fa-file-pdf"/></a>}
                      </div>
                    </td>
                    {/* Mobile-only: combined right-side stats */}
                    <td className="mob-right">
                      <span className={`ns ${STEP_CSS[latestStep]||'ns-check'}`}>{STEP_SHORT[latestStep]||latestStep}</span>

                      {grp.denied>0&&<span className="ms ms-r" style={{fontSize:8}}>✗{grp.denied}</span>}
                      {grp.primary.amount&&(grp.totalAmt===0||statusFilter==='03 Waiting Results')&&<span style={{fontVariantNumeric:'tabular-nums',fontSize:9,color:'var(--td)'}}>{fmt(grp.primary.amount,grp.primary.currency||'USD')}</span>}
                      {grp.totalAmt>0&&statusFilter!=='03 Waiting Results'&&<span style={{fontVariantNumeric:'tabular-nums',fontWeight:700,color:'var(--g)',fontSize:9}}>{fmtByCur(grp.totalAmtByCur)}</span>}
                      {(grp.primary.web||grp.primary.bases)&&<span style={{display:'inline-flex',gap:6,marginLeft:'auto'}}>
                        {grp.primary.web&&<a href={grp.primary.web} target="_blank" rel="noreferrer" className="btn-icon btn-icon-web" onClick={e=>e.stopPropagation()} title="Ver Convocatoria"><i className="fa-solid fa-arrow-up-right-from-square"/></a>}
                        {grp.primary.bases&&<a href={grp.primary.bases} target="_blank" rel="noreferrer" className="btn-icon btn-icon-pdf" onClick={e=>e.stopPropagation()} title="Ver Bases (PDF)"><i className="fa-solid fa-file-pdf"/></a>}
                      </span>}
                    </td>
                  </tr>
                  {isExp&&(
                    <tr><td colSpan={9} style={{padding:0}}>
                      <div className="hist-panel" onClick={e=>e.stopPropagation()}>
                        <div style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',color:'var(--tf)',marginBottom:6}}>
                          {grp.entries.length} Application{grp.entries.length>1?'s':''}
                        </div>
                        {grp.entries.slice().sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||'')).map(e=>(
                          <div key={e.id} className="entry-mini-row" onClick={()=>setCalModalId(e.id)}>
                            <div className="emr-main">
                              <div className="emr-top">
                                <span className="emr-year">{e.deadline?e.deadline.substring(0,4):'—'}</span>
                                <span className={`ns ${STEP_CSS[e.nextStep]||'ns-check'}`}>{STEP_SHORT[e.nextStep]||e.nextStep}</span>
                                {e.deadline&&<span className="emr-dl">{fmtDateShort(e.deadline)}</span>}
                                {(e.amountReceived||e.amount)&&<span className={`emr-amt-big${e.amountReceived?' received':''}`}>{fmt(e.amountReceived||e.amount,e.currency||'USD')}</span>}
                              </div>
                              {e.projectDates&&<div className="emr-proj">{e.projectDates}</div>}
                              {e.documents?.length>0&&<div className="emr-docs">{e.documents.map((d,di)=>{const ti=DOC_TYPES.find(t=>t.value===d.type)||DOC_TYPES[DOC_TYPES.length-1];return(<a key={di} href={d.url} target="_blank" rel="noreferrer" className="emr-doc-btn" title={d.name} onClick={ev=>ev.stopPropagation()}><i className={`fa-solid ${ti.icon}`}/><span>{d.name}</span></a>);})}</div>}
                            </div>
                            <i className="fa-solid fa-chevron-right emr-chevron"/>
                          </div>
                        ))}
                      </div>
                    </td></tr>
                  )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
          </div>
        )}
      </div>

      {showSuggestions&&(
        <div className="modal-ov" onClick={()=>setShowSuggestions(false)}>
          <div className="modal" style={{maxWidth:640}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <h3 style={{margin:0}}>💡 Suggestions inbox {suggestions.length>0&&<span style={{background:'var(--rbg)',color:'var(--r)',borderRadius:3,padding:'2px 8px',fontSize:11,marginLeft:6,fontWeight:700}}>{suggestions.length}</span>}</h3>
              <button className="btn btn-sec" onClick={()=>setShowSuggestions(false)}><i className="fa-solid fa-xmark"/></button>
            </div>
            {suggestions.length===0?(
              <div style={{textAlign:'center',padding:'32px 0',color:'var(--tf)'}}>
                <div style={{fontSize:28,marginBottom:8}}>✓</div>
                No pending suggestions
              </div>
            ):suggestions.map(s=>{
              const gd=s.grant_data||{};
              const hasFullData=Object.keys(gd).length>0;
              return(
              <div key={s.id} style={{background:'var(--s2)',border:'1px solid var(--bd)',borderRadius:3,padding:'12px 14px',marginBottom:10}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:6}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:13,marginBottom:1}}>{s.foundation}</div>
                    {s.grant_name&&<div style={{fontSize:11,color:'var(--td)'}}>{s.grant_name}</div>}
                  </div>
                  <div style={{fontSize:9,color:'var(--tf)',whiteSpace:'nowrap',flexShrink:0}}>{new Date(s.submitted_at).toLocaleDateString()}</div>
                </div>
                {/* Full data grid if submitted via AI batch form */}
                {hasFullData?(
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'3px 16px',fontSize:11,marginBottom:8}}>
                    {gd.deadline&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Deadline </span><span style={{color:'var(--t)'}}>{gd.deadline}</span>{gd.deadlineType==='DDLNE!'&&<span style={{color:'var(--r)',fontSize:9,marginLeft:4}}>HARD</span>}</div>}
                    {gd.amount&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Amount </span><span style={{color:'var(--g)',fontWeight:700}}>${Number(gd.amount).toLocaleString()}</span></div>}
                    {gd.nextStep&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Status </span><span style={{color:'var(--t)'}}>{gd.nextStep}</span></div>}
                    {gd.season&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Season </span><span style={{color:'var(--t)'}}>{gd.season}</span></div>}
                    {gd.eligiblePeriod&&<div style={{gridColumn:'1/-1'}}><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Period </span><span style={{color:'var(--t)'}}>{gd.eligiblePeriod}</span></div>}
                    {gd.web&&<div style={{gridColumn:'1/-1'}}><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Web </span><a href={gd.web} target="_blank" rel="noreferrer" style={{color:'var(--b)'}}>{gd.web}</a></div>}
                  </div>
                ):(
                  <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:11,color:'var(--tf)',marginBottom:6}}>
                    {s.deadline&&<span><i className="fa-solid fa-calendar-days"/> {s.deadline}</span>}
                    {s.web&&<a href={s.web} target="_blank" rel="noreferrer" style={{color:'var(--b)'}}>{s.web}</a>}
                  </div>
                )}
                {(gd.notes||s.notes)&&<div style={{fontSize:11,color:'var(--td)',marginBottom:10,lineHeight:1.5,background:'var(--s3)',borderRadius:2,padding:'5px 8px'}}>{gd.notes||s.notes}</div>}
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-pri" style={{flex:1,fontSize:11}} onClick={()=>acceptSuggestion(s,add,setSuggestions)}>✓ Añadir al Tracker</button>
                  <button className="btn btn-sec" style={{fontSize:11}} onClick={()=>rejectSuggestion(s.id,setSuggestions)}>✕</button>
                </div>
              </div>
            );})}
          </div>
        </div>
      )}
      {showAdd&&(
        <div className="modal-ov" onClick={()=>setShowAdd(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <AddModal onClose={()=>{setShowAdd(false);setAddPrefill(null);}} onAdd={add} prefill={addPrefill}/>
          </div>
        </div>
      )}
    </div>
  );
}

function AddModal({onClose,onAdd,prefill}){
  const pf=prefill||{};
  const[f,sF]=useState({id:Date.now(),deadline:'',deadlineType:'Estimated',foundation:pf.foundation||'',grant:pf.grant||'',nextStep:'02 Check',web:pf.web||'',bases:'',notes:'',amount:null,amountReceived:null,currency:'USD',eligiblePeriod:'',projectDates:'',improvements:'',source:'calendar',reportDeadline:'',season:pf.season||''});
  const s=(k,v)=>sF(p=>({...p,[k]:v}));
  return(
    <>
      <h3>Add Grant</h3>
      <div className="mf"><label>Foundation *</label><input value={f.foundation} onChange={e=>s('foundation',e.target.value)} placeholder="Foundation name"/></div>
      <div className="mf"><label>Grant program</label><input value={f.grant} onChange={e=>s('grant',e.target.value)} placeholder="Specific grant name"/></div>
      <div className="mf"><label>Deadline *</label><input type="date" value={f.deadline} onChange={e=>s('deadline',e.target.value)}/></div>
      <div style={{display:'flex',gap:8}}>
        <div className="mf" style={{flex:1}}><label>Type</label><select value={f.deadlineType} onChange={e=>s('deadlineType',e.target.value)}><option value="DDLNE!">Hard Deadline</option><option value="Estimated">Estimated Deadline</option></select></div>
        <div className="mf" style={{flex:1}}><label>Status</label><select value={f.nextStep} onChange={e=>s('nextStep',e.target.value)}>{STEPS.map(st=><option key={st} value={st}>{STEP_SHORT[st]}</option>)}</select></div>
        <div className="mf" style={{flex:1}}><label>Season</label><select value={f.season||''} onChange={e=>s('season',e.target.value)}><option value="">—</option><option value="Spring">Spring</option><option value="Summer">Summer</option><option value="Fall">Fall</option><option value="Winter">Winter</option><option value="Closed">Closed</option></select></div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <div className="mf" style={{flex:1}}><label>Amount Requested</label><input type="number" value={f.amount||''} onChange={e=>s('amount',e.target.value?parseFloat(e.target.value):null)}/></div>
        <div className="mf" style={{flex:1}}><label>Amount Received</label><input type="number" value={f.amountReceived||''} onChange={e=>s('amountReceived',e.target.value?parseFloat(e.target.value):null)}/></div>
        <div className="mf" style={{flex:'0 0 auto'}}><label>Currency</label><div className="cur-toggle" style={{height:28}}><button type="button" className={`cur-btn${f.currency==='USD'?' on':''}`} onClick={()=>s('currency','USD')}>$ USD</button><button type="button" className={`cur-btn${f.currency==='EUR'?' on':''}`} onClick={()=>s('currency','EUR')}>€ EUR</button></div></div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <div className="mf" style={{flex:1}}><label>Web / Link</label><input value={f.web} onChange={e=>s('web',e.target.value)} placeholder="https://..."/></div>
        <div className="mf" style={{flex:1}}><label>Bases (PDF)</label><input value={f.bases} onChange={e=>s('bases',e.target.value)} placeholder="https://...pdf"/></div>
      </div>
      <div className="mf"><label>Report Deadline</label><input type="date" value={f.reportDeadline} onChange={e=>s('reportDeadline',e.target.value)}/></div>
      <div className="mf"><label>Notes</label><textarea value={f.notes} onChange={e=>s('notes',e.target.value)}/></div>
      <div className="ma">
        <button className="btn btn-sec" onClick={onClose}>Cancel</button>
        <button className="btn btn-pri" onClick={()=>{if(f.foundation.trim()){onAdd(f);onClose();}}}>Add</button>
      </div>
    </>
  );
}

// App is started by the data loader above
</script>
</body>
</html>
