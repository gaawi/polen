<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Polen — Grant Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0a;--panel:#15130f;--panel-2:#1c1a14;--panel-3:#26221a;
  --ink:#f4ede0;--ink-2:#c8c1b3;--ink-3:#8a8475;--ink-4:#5c5749;--ink-5:#3a3629;
  --rule:#2a2620;--rule-2:#3a3528;
  --accent:#ffd233;--accent-2:#ffe680;--accent-soft:#3a3015;
  --ok:#6ee08e;--ok-bg:rgba(110,224,142,.10);
  --warn:#ffa848;--warn-bg:rgba(255,168,72,.10);
  --danger:#ff6b6b;--danger-bg:rgba(255,107,107,.10);
  --info:#7dafff;--info-bg:rgba(125,175,255,.10);
  --mute:#7a7568;--mute-bg:rgba(122,117,104,.08);
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --font-display:'Space Grotesk',system-ui,sans-serif;
}
html.light{
  --bg:#f5f2ec;--panel:#fbf8f1;--panel-2:#efeadd;--panel-3:#e3ddca;
  --ink:#0e0d0a;--ink-2:#2a2820;--ink-3:#5a5446;--ink-4:#8b8475;--ink-5:#b8b1a0;
  --rule:#d4cdb8;--rule-2:#bfb69e;
  --accent:#d39400;--accent-2:#b07a00;--accent-soft:#f4e4b3;
  --ok:#2d8f4a;--ok-bg:rgba(45,143,74,.10);
  --warn:#b85c00;--warn-bg:rgba(184,92,0,.10);
  --danger:#c83434;--danger-bg:rgba(200,52,52,.10);
  --info:#2d5dbb;--info-bg:rgba(45,93,187,.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-mono);font-size:12px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--accent);color:#000;}

/* ── Login ── */
#login-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:center;justify-content:center;}
.login-box{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--rule);padding:28px 24px;}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-logo-icon{width:13px;height:13px;background:var(--accent);flex-shrink:0;box-shadow:5px 0 0 -1px var(--accent),0 5px 0 -1px var(--accent),5px 5px 0 -1px var(--accent);}
.login-logo-text{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1;}
.login-logo-sub{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;margin-top:2px;}
.login-box input{display:block;width:100%;background:var(--panel-2);border:1px solid var(--rule);color:var(--ink);padding:9px 11px;font-size:12px;outline:none;margin-bottom:8px;font-family:var(--font-mono);}
.login-box input:focus{border-color:var(--accent);}
.login-box input::placeholder{color:var(--ink-4);}
#li-btn{width:100%;padding:10px;margin-top:4px;background:var(--accent);color:#000;font-size:12px;font-weight:700;border:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .1s;cursor:pointer;}
#li-btn:hover{background:var(--accent-2);}
#li-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-err{font-size:11px;color:var(--danger);margin-top:8px;min-height:14px;}
.spinner{width:11px;height:11px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Loading ── */
#loading-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:99;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.loading-spinner{width:18px;height:18px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;}

/* ── App shell ── */
.app{min-height:100vh;display:flex;flex-direction:column;}

/* ── Top bar ── */
.tbar{display:flex;align-items:stretch;height:42px;background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20;}
.tb-brand{display:flex;align-items:center;gap:10px;padding:0 16px;border-right:1px solid var(--rule);flex-shrink:0;}
.tb-logo{width:12px;height:12px;background:var(--accent);flex-shrink:0;box-shadow:5px 0 0 -1px var(--accent),0 5px 0 -1px var(--accent),5px 5px 0 -1px var(--accent);}
.tb-name{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1;}
.tb-tag{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;}
.tb-stats{display:flex;flex:1;}
.tb-stat{display:flex;flex-direction:column;justify-content:center;padding:4px 14px;border-right:1px solid var(--rule);min-width:0;cursor:default;}
.tb-stat-label{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.1em;}
.tb-stat-val{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.2;}
.tb-stat-val .x{color:var(--ink-4);font-weight:400;}
.tb-stat-val.urgent{color:var(--danger);}
.tb-stat-val.ok{color:var(--ok);}
.tb-stat-val.accent{color:var(--accent);}
.tb-stat-val.warn{color:var(--warn);}
.tb-actions{display:flex;align-items:center;gap:4px;padding:0 10px;}
.tb-btn{padding:5px 10px;font-size:11px;font-weight:500;border:1px solid var(--rule);background:var(--panel-2);color:var(--ink-2);transition:all .1s;cursor:pointer;}
.tb-btn:hover{border-color:var(--accent);color:var(--ink);}
.tb-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.tb-btn.primary:hover{background:var(--accent-2);}
.tb-iconbtn{width:29px;height:29px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-3);position:relative;}
.tb-iconbtn:hover{color:var(--ink);background:var(--panel-2);}
.tb-badge{position:absolute;top:2px;right:2px;min-width:13px;height:13px;background:var(--danger);color:#fff;border-radius:50%;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 2px;}

/* ── Tab bar ── */
.tabs{display:flex;align-items:stretch;height:36px;background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:42px;z-index:19;}
.tab{display:flex;align-items:center;gap:7px;padding:0 15px;font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;border-right:1px solid var(--rule);position:relative;transition:all .1s;cursor:pointer;background:none;border-top:none;border-bottom:none;border-left:none;}
.tab:hover{color:var(--ink);background:var(--panel-2);}
.tab.active{color:var(--accent);background:var(--bg);}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);}
.tab .num{font-size:10px;color:var(--ink-4);font-weight:400;}
.tab.active .num{color:var(--accent);}
.tab .pulse{width:5px;height:5px;background:var(--danger);flex-shrink:0;animation:pulse 1.8s ease infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
.tab-spacer{flex:1;}
.tab-right{display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid var(--rule);font-size:11px;color:var(--ink-3);}
.tab-search{background:transparent;border:none;outline:none;width:160px;color:var(--ink);font-size:11px;font-family:var(--font-mono);}
.tab-search::placeholder{color:var(--ink-4);}

/* ── Main ── */
.main{flex:1;overflow:auto;}

/* ── Page heading ── */
.ph{display:flex;align-items:baseline;justify-content:space-between;padding:15px 24px 10px;border-bottom:1px solid var(--rule);gap:20px;flex-wrap:wrap;}
.ph-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.ph-eye{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;}
.ph-title{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em;color:var(--ink);}
.ph-title .a{color:var(--accent);}
.ph-sub{font-size:11px;color:var(--ink-3);}
.ph-sub .urgent{color:var(--danger);font-weight:600;}

/* ── Chips (Library) ── */
.chips{display:flex;gap:0;align-items:center;flex-wrap:wrap;}
.chip{padding:5px 11px;font-size:10px;font-weight:500;color:var(--ink-3);background:var(--panel);border:1px solid var(--rule);border-right:none;text-transform:uppercase;letter-spacing:.08em;transition:all .1s;cursor:pointer;}
.chip:last-child{border-right:1px solid var(--rule);}
.chip:hover{color:var(--ink);background:var(--panel-2);}
.chip.on{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
.chip .n{margin-left:5px;opacity:.6;font-weight:400;}

/* ── Grant row ── */
.grow{display:grid;grid-template-columns:84px minmax(0,1fr) 120px 100px 70px 100px;align-items:center;border-bottom:1px solid var(--rule);transition:background .08s;cursor:pointer;min-height:38px;}
.grow:hover{background:var(--panel-2);}
.grow.urgent{box-shadow:inset 2px 0 0 var(--danger);}
.grow.soon{box-shadow:inset 2px 0 0 var(--warn);}
.grow.row-ok{box-shadow:inset 2px 0 0 var(--ok);}
.grow.muted{opacity:.5;}
.grow > div{padding:6px 11px;min-width:0;overflow:hidden;}
.grow .gd{border-right:1px solid var(--rule);}
.gr-date{font-size:11px;color:var(--ink-2);font-weight:500;display:flex;flex-direction:column;line-height:1.15;}
.gr-date .day{color:var(--ink);font-weight:600;}
.gr-date .rel{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
.gr-date .rel.urgent{color:var(--danger);}
.gr-date .rel.soon{color:var(--warn);}
.gr-name{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.gr-name .fdn{color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display);letter-spacing:-.01em;}
.gr-name .prog{color:var(--ink-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.gr-name .proj{color:var(--ink-4);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;font-style:italic;}
.gr-amt{font-size:13px;color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
.gr-amt .c{color:var(--ink-4);font-weight:400;margin-right:1px;}
.gr-amt.received{color:var(--ok);}
.gr-amt.none{color:var(--ink-4);font-weight:400;}

/* ── Status ── */
.st{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;}
.st::before{content:'';width:7px;height:7px;flex-shrink:0;}
.st.drafting{color:var(--warn);}.st.drafting::before{background:var(--warn);}
.st.submitted{color:var(--info);}.st.submitted::before{background:var(--info);}
.st.awarded{color:var(--ok);}.st.awarded::before{background:var(--ok);}
.st.declined{color:var(--danger);}.st.declined::before{background:var(--danger);}
.st.missed{color:var(--mute);}.st.missed::before{background:var(--mute);}
.st.watching{color:var(--accent);}.st.watching::before{background:var(--accent);}

/* ── Type tag ── */
.tg{display:inline-block;font-size:9px;font-weight:600;padding:2px 5px;text-transform:uppercase;letter-spacing:.05em;background:var(--panel-2);color:var(--ink-3);border:1px solid var(--rule);}
.tg.hard{color:var(--danger);border-color:rgba(255,107,107,.3);background:var(--danger-bg);}

/* ── Sparkline ── */
.spark{display:inline-flex;gap:2px;align-items:center;}
.spark .blip{width:6px;height:14px;}
.spark .blip.awarded{background:var(--ok);}
.spark .blip.declined{background:var(--danger);}
.spark .blip.submitted{background:var(--info);}
.spark .blip.missed,.spark .blip.watching{background:var(--mute);opacity:.4;}
.spark .blip.drafting{background:var(--warn);opacity:.7;}
.spark .yr{font-size:9px;color:var(--ink-4);margin-left:3px;}

/* ── Table header ── */
.thead{display:grid;grid-template-columns:84px minmax(0,1fr) 120px 100px 70px 100px;background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:78px;z-index:10;}
.thead > div{padding:7px 11px;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-4);font-weight:600;border-right:1px solid var(--rule);}
.thead > div:last-child{border-right:none;}
.t-end{text-align:right;}

/* ── Library section divider ── */
.lsec{background:var(--panel);padding:7px 24px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;}
.lsec .name{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink);letter-spacing:-.01em;}
.lsec .meta{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;margin-left:auto;}
.lsec .meta strong{color:var(--ink-2);font-weight:600;}

/* ── KPI strip ── */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--rule);}
.kpi{padding:12px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;background:var(--panel);}
.kpi:last-child{border-right:none;}
.kpi-label{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;}
.kpi-val{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.kpi-val .c{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--ink-4);margin-right:2px;vertical-align:3px;}
.kpi-val.urgent{color:var(--danger);}
.kpi-val.ok{color:var(--ok);}
.kpi-val.accent{color:var(--accent);}
.kpi-sub{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;}
.kpi-sub.urgent{color:var(--danger);}
.kpi-sub.ok{color:var(--ok);}

/* ── Section header ── */
.shead{display:flex;align-items:baseline;justify-content:space-between;padding:12px 24px 6px;gap:14px;border-top:1px solid var(--rule);background:var(--bg);}
.shead.first{border-top:none;}
.shead-title{font-family:var(--font-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);}
.shead-title.urgent{color:var(--danger);}
.shead-title .accent{color:var(--accent);}
.shead-meta{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;}

/* ── Thermometer ── */
.thermo{padding:8px 12px;background:var(--panel-2);border-top:1px solid var(--rule);}
.thermo-head{display:flex;align-items:center;justify-content:space-between;font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.thermo-head .st-tag{font-weight:600;color:var(--ink-2);}
.thermo-head .st-tag.urgent{color:var(--danger);}
.thermo-head .st-tag.ok{color:var(--ok);}
.thermo-bar{position:relative;height:4px;background:var(--rule);overflow:visible;}
.thermo-fill{height:100%;background:var(--accent);}
.thermo-fill.ok{background:var(--ok);}
.thermo-fill.urgent{background:var(--danger);}
.thermo-fill.done{background:var(--ink-4);}
.thermo-fill.pre{background:var(--info);}
.thermo-now{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink);transform:translateX(-1px);}
.thermo-flag{position:absolute;top:-12px;transform:translateX(-50%);font-size:8px;font-weight:600;display:flex;flex-direction:column;align-items:center;}
.thermo-flag .ft{width:1px;height:10px;background:currentColor;margin-top:1px;}
.thermo-flag.dl{color:var(--warn);}
.thermo-flag.rpt{color:var(--accent);}
.thermo-dates{display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:var(--ink-4);}

/* ── Drawer ── */
.dr-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,92vw);background:var(--panel);border-left:1px solid var(--rule);z-index:51;overflow-y:auto;display:flex;flex-direction:column;}
.dr-head{padding:16px 20px 14px;border-bottom:1px solid var(--rule);background:var(--bg);position:relative;}
.dr-close{position:absolute;top:10px;right:12px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--ink-3);font-size:13px;cursor:pointer;border:none;}
.dr-close:hover{background:var(--accent);color:#000;}
.dr-eye{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px;}
.dr-title{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.02em;margin-bottom:3px;}
.dr-fdn{font-size:11px;color:var(--ink-3);}
.dr-meta{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);}
.dr-body{padding:16px 20px;flex:1;}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
.dr-f .l{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;margin-bottom:2px;}
.dr-f .v{font-size:12px;color:var(--ink);font-weight:500;}
.dr-f .v.amt{font-size:17px;font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;}
.dr-f .v.amt.ok{color:var(--ok);}
.dr-f.full{grid-column:1/-1;}
.dr-notes{margin-top:12px;padding:10px 12px;background:var(--panel-2);border-left:2px solid var(--accent);font-size:11px;color:var(--ink-2);line-height:1.6;}
.dr-notes .l{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;margin-bottom:3px;}
.dr-hist{margin-top:12px;}
.dr-hist-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule);align-items:center;font-size:11px;}
.dr-hist-row:last-child{border-bottom:none;}
.dr-hist-row .yr{color:var(--ink-2);font-weight:600;}
.dr-hist-row .amt-h{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums;}

/* ── Insights ── */
.ig{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule);}
.ig-cell{padding:16px 20px;border-right:1px solid var(--rule);background:var(--panel);}
.ig-cell:last-child{border-right:none;}
.ig-cell h3{font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:8px;}
.ig-cell .big{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;}
.ig-cell .big .c{font-family:var(--font-mono);font-size:13px;color:var(--ink-4);font-weight:500;margin-right:2px;vertical-align:3px;}
.ig-cell .sub{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.ig-cell .sub strong{color:var(--ok);font-weight:600;}
.ig-row{display:grid;grid-template-columns:repeat(2,1fr);border-bottom:1px solid var(--rule);}
.ig-row .ig-cell{padding:18px 22px;}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.bar-row{display:grid;grid-template-columns:1fr 60px;align-items:center;gap:10px;}
.bar-row .bl{display:flex;align-items:center;gap:8px;}
.bar-row .bl-name{color:var(--ink-2);font-size:10px;flex-shrink:0;width:80px;text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .bl-track{flex:1;height:12px;background:var(--bg);}
.bar-row .bl-fill{height:100%;background:var(--accent);}
.bar-row .bl-fill.ok{background:var(--ok);}
.bar-row .bl-fill.danger{background:var(--danger);}
.bar-row .bl-fill.info{background:var(--info);}
.bar-row .bl-fill.warn{background:var(--warn);}
.bar-row .bl-fill.mute{background:var(--ink-4);}
.bar-row .num{font-size:11px;color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}

/* ── Active cards ── */
.active-card{border:1px solid var(--rule);margin:10px 24px;background:var(--panel);cursor:pointer;transition:border-color .1s;}
.active-card:hover{border-color:var(--ok);}
.active-card-head{padding:12px 14px;border-bottom:1px solid var(--rule);}
.ac-fdn{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink);}
.ac-grant{font-size:12px;color:var(--ink-3);margin-top:2px;}
.ac-proj{font-size:10px;color:var(--ink-4);margin-top:1px;font-style:italic;}
.ac-meta{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;}
.ac-amt{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--ok);font-variant-numeric:tabular-nums;}
.ac-days{font-size:11px;font-weight:600;}
.ac-rpt{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;}

/* ── Footer ── */
.fbar{display:flex;align-items:center;gap:12px;padding:5px 18px;height:26px;background:var(--panel);border-top:1px solid var(--rule);font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.1em;position:sticky;bottom:0;}
.fbar .dot{width:5px;height:5px;background:var(--ok);}
.fbar .right{margin-left:auto;display:flex;gap:10px;}

/* ── Empty state ── */
.empty{padding:50px 24px;text-align:center;color:var(--ink-4);font-size:11px;text-transform:uppercase;letter-spacing:.1em;}
.empty .ico{font-size:30px;color:var(--ink-5);margin-bottom:10px;}

/* ── Modal overlay ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--panel);border:1px solid var(--rule);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px;}
.modal h3{font-family:var(--font-display);font-size:15px;font-weight:700;margin-bottom:16px;}
.mf{margin-bottom:11px;}
.mf label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-4);margin-bottom:3px;font-weight:600;}
.mf input,.mf select,.mf textarea{width:100%;background:var(--panel-2);border:1px solid var(--rule);color:var(--ink);padding:7px 9px;font-size:12px;outline:none;font-family:var(--font-mono);}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--accent);}
.mf select option{background:var(--panel);}
.mf textarea{min-height:60px;resize:vertical;}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ma{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}

/* ── Edit sheet (full-screen) ── */
.sheet-mo{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:65;display:flex;flex-direction:column;}
.sheet-mo-head{display:flex;align-items:center;padding:0 16px;height:42px;background:var(--panel);border-bottom:1px solid var(--rule);gap:12px;flex-shrink:0;}
.sheet-mo-head .title{font-family:var(--font-display);font-weight:700;font-size:14px;}
.sheet-mo-body{flex:1;overflow:auto;}
.sheet-wrap{overflow-x:auto;}
.sheet{border-collapse:collapse;width:100%;font-size:11px;}
.sheet th,.sheet td{padding:4px 7px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;}
.sheet th{background:var(--panel);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);position:sticky;top:0;z-index:5;cursor:pointer;user-select:none;}
.sheet th.so{color:var(--accent);}
.sheet tr:hover td{background:var(--panel-2);}
.sheet input,.sheet textarea,.sheet select{background:transparent;border:none;outline:none;width:100%;padding:0;font-size:11px;color:var(--ink);resize:none;font-family:var(--font-mono);}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{background:var(--accent-soft);}
.cell-id{color:var(--ink-4);font-size:10px;text-align:right;}
.cell-amt{text-align:right;font-variant-numeric:tabular-nums;}
.cell-date .date-disp{cursor:pointer;color:var(--ink-2);}
.date-hidden{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
.cell-del button{color:var(--danger);font-size:10px;padding:0 4px;}
.col-resize{position:absolute;right:0;top:0;bottom:0;width:4px;cursor:col-resize;z-index:6;}
.col-resize:hover{background:var(--accent);}
th{position:relative;}

/* ── Edit in drawer ── */
.dr-edit-form .mf{margin-bottom:10px;}
.dr-edit-form input,.dr-edit-form select,.dr-edit-form textarea{width:100%;background:var(--panel-2);border:1px solid var(--rule);color:var(--ink);padding:7px 9px;font-size:12px;outline:none;font-family:var(--font-mono);}
.dr-edit-form input:focus,.dr-edit-form select:focus,.dr-edit-form textarea:focus{border-color:var(--accent);}
.dr-edit-form select option{background:var(--panel);}

.dr-edit-form .mf label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-4);margin-bottom:3px;font-weight:600;}

/* ── Responsive ── */

}

<script type="text/babel">
const {useState,useMemo,useCallback,useRef,useEffect}=React;

// ── Status mapping ──
const STEP_MAP={'00 Send Proposal':'drafting','01 Apply on deadline':'drafting','02 Check':'watching','03 Waiting Results':'submitted','04 Denied':'declined','05 Received':'awarded','06 Not Applied':'watching','07 Missed Deadline':'missed','08 Not Eligible':'declined'};
const STEPS=['01 Apply on deadline','02 Check','03 Waiting Results','05 Received','04 Denied','06 Not Applied','07 Missed Deadline','08 Not Eligible'];
const STEP_SHORT={'00 Send Proposal':'Drafting','01 Apply on deadline':'Drafting','02 Check':'Watching','03 Waiting Results':'Submitted','04 Denied':'Declined','05 Received':'Awarded','06 Not Applied':'Watching','07 Missed Deadline':'Missed','08 Not Eligible':'Declined'};
const STATUS_LABELS={drafting:'Drafting',submitted:'Submitted',awarded:'Awarded',declined:'Declined',missed:'Missed',watching:'Watching'};
const STATUS_ORDER=['drafting','submitted','awarded','declined','missed','watching'];
function mapStatus(ns){return STEP_MAP[ns]||'watching';}

// ── Date helpers ──
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MOIDX={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseDate(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d.getTime())?null:d;}
function daysUntilDate(s){const d=parseDate(s);if(!d)return null;return Math.ceil((d-new Date())/86400000);}
function fmtDateShort(s){const d=parseDate(s);if(!d)return'—';return`${MON[d.getMonth()]} ${d.getDate()}`;}
function fmtDateFull(s){const d=parseDate(s);if(!d)return'—';return`${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;}
function fmtDateISO(s){const d=parseDate(s);if(!d)return'—';return`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function fmtMoney(n){if(n==null)return null;if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(n>=10000?0:1)+'k';return n.toLocaleString();}
function fmtMoneyFull(n){if(n==null)return'—';return n.toLocaleString('en-US');}
function relativeDays(days){if(days==null)return'';if(days===0)return'today';if(days===1)return'1d';if(days===-1)return'1d ago';if(days>0&&days<=60)return`${days}d`;if(days<0&&days>=-60)return`${Math.abs(days)}d ago`;if(days>0)return`${Math.ceil(days/30)}mo`;return`${Math.ceil(Math.abs(days)/30)}mo ago`;}
function urgencyClass(days){if(days==null)return'';if(days<0)return'muted';if(days<=7)return'urgent';if(days<=30)return'soon';return'';}

// ── Period parser ──
function parsePeriodDate(s){if(!s)return null;const m=s.trim().replace(/\./g,'').match(/([A-Za-z]+)\s+(\d{1,2}),?\s*(\d{2,4})/);if(!m)return null;const mo=MOIDX[m[1].toLowerCase().substring(0,3)];if(mo===undefined)return null;let y=parseInt(m[3]);if(y<100)y+=2000;return new Date(y,mo,parseInt(m[2]));}
function parsePeriod(p){if(!p)return null;const pts=p.split(/\s*(?:–|—|to|-)\s*/);if(pts.length<2)return null;const s=parsePeriodDate(pts[0]),e=parsePeriodDate(pts[pts.length-1]);return s&&e?{start:s,end:e}:null;}
// Legacy alias used by EditSheet
function pDate(s){return parsePeriodDate(s);}
function pPeriod(p){return parsePeriod(p);}
function fmtDate(s){return fmtDateFull(s);}

// ── computeProgramGroups ──
function computeProgramGroups(data){
  const now=new Date();now.setHours(0,0,0,0);
  const map={};
  data.forEach(g=>{
    const key=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();
    if(!map[key])map[key]={key,foundation:(g.foundation||'').trim(),grant:(g.grant||'').trim(),entries:[]};
    map[key].entries.push(g);
  });
  return Object.values(map).map(grp=>{
    grp.entries.sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||''));
    const upcoming=grp.entries.filter(e=>e.deadline&&parseDate(e.deadline)>=now).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0]||null;
    const de=upcoming||grp.entries[0];
    const status=mapStatus(de?.nextStep||'02 Check');
    const history=grp.entries.filter(e=>e.deadline).map(e=>({year:parseInt(e.deadline.substring(0,4)),status:mapStatus(e.nextStep),amount:e.amountReceived||e.amount||null})).sort((a,b)=>a.year-b.year);
    return{...grp,upcoming,displayEntry:de,status,history,
      deadline:de?.deadline||null,
      deadlineType:de?.deadlineType==='DDLNE!'?'hard':'est',
      amount:de?.amount||null,
      amountReceived:de?.amountReceived||null,
      period:de?.eligiblePeriod||null,
      reportDeadline:de?.reportDeadline||null,
      web:de?.web||null,
      notes:de?.notes||null,
      project:de?.projectDates||null,
    };
  });
}

// ── St ──
function St({status}){return <span className={`st ${status||'watching'}`}>{STATUS_LABELS[status]||status}</span>;}

// ── Spark ──
function Spark({history}){
  if(!history||!history.length)return <span className="spark"><span className="yr">new</span></span>;
  const sorted=[...history].sort((a,b)=>a.year-b.year);
  return(
    <span className="spark" title={sorted.map(h=>`${h.year}: ${STATUS_LABELS[h.status]}${h.amount?'·$'+fmtMoney(h.amount):''}`).join(' · ')}>
      {sorted.map((h,i)=><span key={i} className={`blip ${h.status}`}/>)}
      <span className="yr">·{sorted.length}y</span>
    </span>
  );
}

// ── GRow ──
function GRow({g,onClick}){
  const {status,history,foundation,grant,project,deadlineType}=g;
  const relDate=status==='awarded'&&g.reportDeadline?g.reportDeadline:g.deadline;
  const days=daysUntilDate(relDate);
  const urg=(status==='drafting'||status==='submitted'||(status==='awarded'&&g.reportDeadline))?urgencyClass(days):'';
  const showAmt=g.amountReceived??g.amount;
  const isReceived=g.amountReceived!=null&&g.amountReceived>0;
  const rowCls=status==='missed'?'muted':urg==='urgent'?'urgent':urg==='soon'?'soon':(status==='awarded'&&!g.reportDeadline)?'row-ok':'';
  return(
    <div className={`grow ${rowCls}`} onClick={()=>onClick&&onClick(g)}>
      <div className="gr-date gd">
        <span className="day">{fmtDateShort(relDate)}</span>
        <span className={`rel ${urg}`}>{days!=null?relativeDays(days):'—'}</span>
      </div>
      <div className="gr-name gd">
        <span className="fdn">{foundation}</span>
        <span className="prog">{grant}</span>
        {project&&<span className="proj">{project}</span>}
      </div>
      <div className="gd col-hide-sm" style={{display:'flex',alignItems:'center'}}><St status={status}/></div>
      <div className="gd col-hide-md" style={{display:'flex',alignItems:'center'}}><Spark history={history}/></div>
      <div className="gd col-hide-md" style={{display:'flex',alignItems:'center'}}>
        <span className={`tg ${deadlineType==='hard'?'hard':'est'}`}>{deadlineType==='hard'?'HARD':'EST'}</span>
      </div>
      <div className={`gr-amt ${isReceived?'received':!showAmt?'none':''}`}>
        {showAmt!=null?<><span className="c">$</span>{fmtMoney(showAmt)}</>:'—'}
      </div>
    </div>
  );
}

// ── THead ──
function THead(){
  return(
    <div className="thead">
      <div>Deadline</div>
      <div>Foundation · Program</div>
      <div className="col-hide-sm">Status</div>
      <div className="col-hide-md">History</div>
      <div className="col-hide-md">Type</div>
      <div className="t-end">Amount</div>
    </div>
  );
}

// ── Thermo ──
function Thermo({period,deadline,reportDeadline}){
  const p=parsePeriod(period);if(!p)return null;
  const now=new Date(),{start:s,end:e}=p,tot=e-s;if(tot<=0)return null;
  const pct=Math.max(0,Math.min(100,(now-s)/tot*100));
  let label,cls;
  if(now<s){const d=Math.ceil((s-now)/86400000);label=d<=30?`STARTS IN ${d}D`:'NOT STARTED';cls='pre';}
  else if(now>e){label='PERIOD ENDED';cls='done';}
  else{const d=Math.ceil((e-now)/86400000);label=d<=30?`${d}D LEFT`:`${Math.round(pct)}% · ${d}D LEFT`;cls=d<=30?'urgent':'ok';}
  const dlDate=deadline?parseDate(deadline):null;
  const dlPct=dlDate&&dlDate>=s&&dlDate<=e?((dlDate-s)/tot*100):null;
  const rdDate=reportDeadline?parseDate(reportDeadline):null;
  const rdPct=rdDate&&rdDate>=s&&rdDate<=e?((rdDate-s)/tot*100):null;
  const fmt=d=>`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`;
  return(
    <div className="thermo">
      <div className="thermo-head"><span>PERIOD</span><span className={`st-tag ${cls==='urgent'?'urgent':cls==='ok'?'ok':''}`}>{label}</span></div>
      <div className="thermo-bar">
        <div className={`thermo-fill ${cls}`} style={{width:Math.max(pct,2)+'%'}}/>
        {now>=s&&now<=e&&<div className="thermo-now" style={{left:pct+'%'}}/>}
        {dlPct!=null&&<div className="thermo-flag dl" style={{left:dlPct+'%'}}><span>DL</span><div className="ft"/></div>}
        {rdPct!=null&&<div className="thermo-flag rpt" style={{left:rdPct+'%'}}><span>RPT</span><div className="ft"/></div>}
      </div>
      <div className="thermo-dates"><span>{fmt(s)}</span><span>{fmt(e)}</span></div>
    </div>
  );
}

// ── Drawer ──
function Drawer({g,onClose,onChangeField}){
  if(!g)return null;
  const de=g.displayEntry;
  const days=daysUntilDate(g.deadline);
  const rdays=daysUntilDate(g.reportDeadline);
  const [editing,setEditing]=useState(false);
  const [form,setForm]=useState({});
  const startEdit=()=>{setForm({...de});setEditing(true);};
  const saveEdit=()=>{if(form&&de)Object.keys(form).forEach(k=>{if(form[k]!==de[k])onChangeField(de.id,k,form[k]);});setEditing(false);};
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  return(
    <>
      <div className="dr-bg" onClick={onClose}/>
      <div className="dr">
        <div className="dr-head">
          <button className="dr-close" onClick={onClose}>✕</button>
          <div className="dr-eye">{g.foundation}</div>
          <div className="dr-title">{g.grant||'—'}</div>
          {g.project&&<div className="dr-fdn">{g.project}</div>}
          <div className="dr-meta">
            <St status={g.status}/>

function TodayView({groups,onOpen}){
  const buckets=useMemo(()=>{
    const drafting=groups.filter(g=>g.status==='drafting').sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
    const submitted=groups.filter(g=>g.status==='submitted').sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
    const reportsDue=groups.filter(g=>g.status==='awarded'&&g.reportDeadline).sort((a,b)=>(a.reportDeadline||'').localeCompare(b.reportDeadline||''));
    const watching=groups.filter(g=>g.status==='watching'&&g.deadline).sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
    return{drafting,submitted,reportsDue,watching};
  },[groups]);
  const urgentCount=buckets.drafting.filter(g=>{const d=daysUntilDate(g.deadline);return d!=null&&d<=7;}).length;
  const pendingAmt=buckets.submitted.reduce((s,g)=>s+(g.amount||0),0);
  const draftingAmt=buckets.drafting.reduce((s,g)=>s+(g.amount||0),0);

  const ytdAwarded=groups.filter(g=>g.status==='awarded'&&parseDate(g.deadline)&&parseDate(g.deadline).getFullYear()>=2025).reduce((s,g)=>s+(g.amountReceived||0),0);

        <div className="ph-left">

            <div className="ph-eye">{todayStr} · {fmtDateISO(todayISO)}</div>

          </div>
          <div className="ph-sub">
            {urgentCount>0&&<><span className="urgent">{urgentCount} due ≤7d</span> · </>}

      </div>
      <div className="kpi-strip">
        <div className="kpi">
          <div className="kpi-label">Drafting</div>
          <div className={`kpi-val ${urgentCount>0?'urgent':''}`}>{buckets.drafting.length}</div>
          <div className={`kpi-sub ${urgentCount>0?'urgent':''}`}>{urgentCount>0?`${urgentCount} ≤ 7 DAYS`:'ON TRACK'}</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Pipeline</div>
          <div className="kpi-val"><span className="c">$</span>{fmtMoney(pendingAmt+draftingAmt)}</div>
          <div className="kpi-sub">IN FLIGHT</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Pending Decision</div>
          <div className="kpi-val accent">{buckets.submitted.length}</div>
          <div className="kpi-sub">${fmtMoney(pendingAmt)} AT STAKE</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Awarded YTD</div>
          <div className="kpi-val ok"><span className="c">$</span>{fmtMoney(ytdAwarded)}</div>
          <div className="kpi-sub ok">{groups.filter(g=>g.status==='awarded').length} ACTIVE</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Reports ≤60d</div>
          <div className={`kpi-val ${reportsSoon>0?'urgent':''}`}>{reportsSoon}</div>
          <div className="kpi-sub">OF {buckets.reportsDue.length} ACTIVE</div>
        </div>
      </div>
      {buckets.drafting.length>0&&<>
        <div className="shead first">
          <div className={`shead-title ${urgentCount>0?'urgent':''}`}>▸ Apply <span className="accent">now</span></div>
          <div className="shead-meta">{buckets.drafting.length} open · ${fmtMoney(draftingAmt)} requestable</div>
        </div>
        <THead/>
        {buckets.drafting.map(g=><GRow key={g.key} g={g} onClick={onOpen}/>)}
      </>}
      {buckets.submitted.length>0&&<>
        <div className="shead">
          <div className="shead-title">▸ Awaiting <span className="accent">response</span></div>
          <div className="shead-meta">{buckets.submitted.length} submitted · ${fmtMoney(pendingAmt)} pending</div>
        </div>
        <THead/>
        {buckets.submitted.map(g=><GRow key={g.key} g={g} onClick={onOpen}/>)}
      </>}
      {buckets.reportsDue.length>0&&<>
        <div className="shead">
          <div className="shead-title">▸ Reports <span className="accent">coming up</span></div>
          <div className="shead-meta">{buckets.reportsDue.length} active grants</div>
        </div>

// ── LIBRARY VIEW ──
function ListView({groups,onOpen,search,setSearch,statusFilter,setStatusFilter}){
  const filtered=useMemo(()=>{
    let r=[...groups];
    if(statusFilter!=='all')r=r.filter(g=>g.status===statusFilter);
    if(search){const q=search.toLowerCase();r=r.filter(g=>(g.foundation||'').toLowerCase().includes(q)||(g.grant||'').toLowerCase().includes(q)||(g.notes||'').toLowerCase().includes(q));}
    return r;
  },[groups,search,statusFilter]);
  const fdnGroups=useMemo(()=>{
    const m={};
    filtered.forEach(g=>{const k=g.foundation;if(!m[k])m[k]={name:k,entries:[],awarded:0};m[k].entries.push(g);if(g.status==='awarded')m[k].awarded+=(g.amountReceived||0);});
    Object.values(m).forEach(grp=>grp.entries.sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||'')));
    return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name));
  },[filtered]);
  const statuses=['all',...STATUS_ORDER];
  return(
    <>
      <div className="ph">
        <div className="ph-left">
          <div>
            <div className="ph-eye">{groups.length} programs · {filtered.length} shown</div>
            <h1 className="ph-title">CMD <span className="a">/library</span></h1>
          </div>
          <div className="ph-sub">All grants grouped by funder.</div>
        </div>
        <div className="chips">
          {statuses.map(s=>(
            <button key={s} className={`chip ${statusFilter===s?'on':''}`} onClick={()=>setStatusFilter(s)}>
              {s==='all'?'All':STATUS_LABELS[s]}
              {s!=='all'&&<span className="n">{groups.filter(g=>g.status===s).length}</span>}
            </button>
          ))}
        </div>
      </div>
      <THead/>
      {fdnGroups.length===0&&<div className="empty"><div className="ico">[ ∅ ]</div>NO MATCHES</div>}
      {fdnGroups.map(fgrp=>(
        <div key={fgrp.name}>
          <div className="lsec">
            <span className="name">{fgrp.name}</span>
            <span className="meta">
              <strong>{fgrp.entries.length}</strong> program{fgrp.entries.length>1?'s':''}
              {fgrp.awarded>0&&<> · <strong style={{color:'var(--ok)'}}>{'$'+fmtMoney(fgrp.awarded)}</strong> won</>}
            </span>
          </div>
          {fgrp.entries.map(g=><GRow key={g.key} g={g} onClick={onOpen}/>)}
        </div>
      ))}
    </>
  );
}

// ── ACTIVE VIEW ──
function ActiveView({data,groups,onOpen}){
  const now=new Date();
  const active=useMemo(()=>data.filter(g=>{
    if(g.nextStep!=='05 Received')return false;
    const p=parsePeriod(g.eligiblePeriod);
    return p&&now>=p.start&&now<=p.end;
  }).sort((a,b)=>{
    const pa=parsePeriod(a.eligiblePeriod),pb=parsePeriod(b.eligiblePeriod);
    return(pa?pa.end:new Date('9999'))-(pb?pb.end:new Date('9999'));
  }),[data]);
  const totalAmt=active.reduce((s,g)=>s+(g.amountReceived||g.amount||0),0);
  const findGroup=useCallback((entry)=>groups.find(g=>g.entries.some(e=>e.id===entry.id)),[groups]);
  return(
    <>
      <div className="ph">
        <div className="ph-left">
          <div>
            <div className="ph-eye">{active.length} active · ${fmtMoney(totalAmt)} deployed</div>
            <h1 className="ph-title">CMD <span className="a">/active</span></h1>
          </div>
          <div className="ph-sub">Awarded grants within their active period.</div>
        </div>
      </div>
      {active.length===0?<div className="empty"><div className="ico">[ ∅ ]</div>NO ACTIVE PERIODS</div>:
        active.map(g=>{
          const p=parsePeriod(g.eligiblePeriod);
          const daysLeft=p?Math.ceil((p.end-now)/86400000):null;
          const rddays=daysUntilDate(g.reportDeadline);
          const grp=findGroup(g);
          return(
            <div key={g.id} className="active-card" onClick={()=>grp&&onOpen(grp)}>
              <div className="active-card-head">
                <div className="ac-fdn">{g.foundation}</div>
                <div className="ac-grant">{g.grant||'—'}</div>
                {g.projectDates&&<div className="ac-proj">{g.projectDates}</div>}
                <div className="ac-meta">
                  <div className="ac-amt">${fmtMoney(g.amountReceived||g.amount)}</div>
                  {daysLeft!=null&&<div className="ac-days" style={{color:daysLeft<=30?'var(--danger)':daysLeft<=90?'var(--warn)':'var(--ok)'}}>{daysLeft}d left</div>}
                  {g.reportDeadline&&<div className="ac-rpt">RPT {fmtDateShort(g.reportDeadline)}{rddays!=null&&<> · {relativeDays(rddays)}</>}</div>}
                </div>
              </div>
              <Thermo period={g.eligiblePeriod} deadline={g.deadline} reportDeadline={g.reportDeadline}/>
              {g.notes&&<div style={{padding:'8px 12px',fontSize:11,color:'var(--ink-3)',borderTop:'1px solid var(--rule)'}}>{g.notes}</div>}
            </div>
          );
        })
      }
    </>
  );
}

// ── CALENDAR VIEW ──
function CalendarView({groups,onOpen}){
  const now=new Date();now.setHours(0,0,0,0);
  const months=useMemo(()=>{
    const upcoming=groups.filter(g=>g.deadline&&parseDate(g.deadline)>=now).sort((a,b)=>a.deadline.localeCompare(b.deadline));
    const byMonth={};
    upcoming.forEach(g=>{
      const d=parseDate(g.deadline);
      const key=d.getFullYear()+'-'+String(d.getMonth()).padStart(2,'0');
      if(!byMonth[key])byMonth[key]={key,short:d.toLocaleDateString('en-US',{month:'long'}).toUpperCase(),year:d.getFullYear(),month:d.getMonth(),entries:[]};
      byMonth[key].entries.push(g);
    });
    return Object.values(byMonth);
  },[groups]);
  const total=months.reduce((s,m)=>s+m.entries.length,0);
  return(
    <>
      <div className="ph">
        <div className="ph-left">
          <div>
            <div className="ph-eye">{total} upcoming deadlines</div>
            <h1 className="ph-title">CMD <span className="a">/calendar</span></h1>
          </div>
          <div className="ph-sub">Open deadlines ordered by month.</div>
        </div>
      </div>
      {months.length===0?<div className="empty"><div className="ico">[ ∅ ]</div>NO UPCOMING DEADLINES</div>:
        months.map((m,idx)=>{
          const isCurrent=m.year===now.getFullYear()&&m.month===now.getMonth();
          const totalAmt=m.entries.reduce((s,g)=>s+(g.amount||0),0);
          return(
            <div key={m.key}>
              <div className={`shead ${idx===0?'first':''}`}>
                <div className="shead-title">▸ {m.short} <span style={{color:'var(--ink-4)'}}>{m.year}</span>{isCurrent&&<span className="accent" style={{marginLeft:8}}>· NOW</span>}</div>
                <div className="shead-meta">{m.entries.length} deadline{m.entries.length>1?'s':''} · ${fmtMoney(totalAmt)}</div>
              </div>
              {idx===0&&<THead/>}
              {m.entries.map(g=><GRow key={g.key} g={g} onClick={onOpen}/>)}
            </div>
          );
        })
      }
    </>
  );
}

// ── INSIGHTS VIEW ──
function InsightsView({groups}){
  const stats=useMemo(()=>{
    const decided=groups.filter(g=>g.status==='awarded'||g.status==='declined');
    const won=groups.filter(g=>g.status==='awarded');
    const winRate=decided.length>0?Math.round(won.length/decided.length*100):0;
    const totalReq=groups.reduce((s,g)=>s+(g.amount||0),0);
    const totalAwd=won.reduce((s,g)=>s+(g.amountReceived||0),0);
    const avgAward=won.length>0?Math.round(totalAwd/won.length):0;
    const byStatus={};STATUS_ORDER.forEach(s=>byStatus[s]=groups.filter(g=>g.status===s).length);
    const byFdn={};won.forEach(g=>{const k=g.foundation;if(!byFdn[k])byFdn[k]={name:k,amount:0};byFdn[k].amount+=(g.amountReceived||0);});
    const topFdn=Object.values(byFdn).sort((a,b)=>b.amount-a.amount).slice(0,6);
    const pendingAmt=groups.filter(g=>g.status==='submitted').reduce((s,g)=>s+(g.amount||0),0);
    const draftingAmt=groups.filter(g=>g.status==='drafting').reduce((s,g)=>s+(g.amount||0),0);
    return{winRate,won:won.length,decided:decided.length,totalReq,totalAwd,avgAward,byStatus,topFdn,pendingAmt,draftingAmt};
  },[groups]);
  const maxSt=Math.max(...Object.values(stats.byStatus),1);
  const maxFdn=stats.topFdn[0]?.amount||1;
  return(
    <>
      <div className="ph">
        <div className="ph-left">
          <div>
            <div className="ph-eye">all-time stats</div>
            <h1 className="ph-title">CMD <span className="a">/insights</span></h1>
          </div>
          <div className="ph-sub">Pipeline performance across all cycles.</div>
        </div>
      </div>
      <div className="ig">
        <div className="ig-cell"><h3>Total Awarded</h3><div className="big"><span className="c">$</span>{fmtMoney(stats.totalAwd)}</div><div className="sub">{stats.won} grants · avg ${fmtMoney(stats.avgAward)}</div></div>
        <div className="ig-cell"><h3>Win Rate</h3><div className="big" style={{color:'var(--accent)'}}>{stats.winRate}<span style={{fontSize:17}}>%</span></div><div className="sub">{stats.won}/{stats.decided} decided</div></div>
        <div className="ig-cell"><h3>Pipeline</h3><div className="big"><span className="c">$</span>{fmtMoney(stats.pendingAmt+stats.draftingAmt)}</div><div className="sub">{groups.filter(g=>g.status==='submitted'||g.status==='drafting').length} in flight</div></div>
        <div className="ig-cell"><h3>Capture Rate</h3><div className="big">{stats.totalReq>0?Math.round(stats.totalAwd/stats.totalReq*100):0}<span style={{fontSize:17}}>%</span></div><div className="sub">${fmtMoney(stats.totalAwd)} of ${fmtMoney(stats.totalReq)}</div></div>
      </div>
      <div className="ig-row">
        <div className="ig-cell">
          <h3>By Status</h3>
          <div className="bars">
            {STATUS_ORDER.map(s=>{
              const cc=s==='awarded'?'ok':s==='declined'?'danger':s==='submitted'?'info':s==='drafting'?'warn':'mute';
              return(<div key={s} className="bar-row"><div className="bl"><span className="bl-name">{STATUS_LABELS[s]}</span><div className="bl-track"><div className={`bl-fill ${cc}`} style={{width:(stats.byStatus[s]/maxSt*100||1)+'%'}}/></div></div><span className="num">{stats.byStatus[s]}</span></div>);
            })}
          </div>
        </div>
        <div className="ig-cell">
          <h3>Top Funders · by $ Awarded</h3>
          <div className="bars">
            {stats.topFdn.map(f=>(
              <div key={f.name} className="bar-row">
                <div className="bl">
                  <span className="bl-name" style={{width:120,fontFamily:'var(--font-display)',fontSize:11,textTransform:'none',letterSpacing:0}}>{f.name.length>22?f.name.substring(0,20)+'…':f.name}</span>
                  <div className="bl-track"><div className="bl-fill ok" style={{width:(f.amount/maxFdn*100)+'%'}}/></div>
                </div>
                <span className="num">${fmtMoney(f.amount)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

      <div className="mf"><label>Grant Period</label><input value={f.eligiblePeriod||''} onChange={e=>s('eligiblePeriod',e.target.value)} placeholder="Jan 1, 2026 – Dec 31, 2026"/></div>
      <div className="mf"><label>Project</label><input value={f.projectDates||''} onChange={e=>s('projectDates',e.target.value)} placeholder="Project name"/></div>
      <div className="mf"><label>Web / Link</label><input value={f.web} onChange={e=>s('web',e.target.value)} placeholder="https://..."/></div>
      <div className="mf"><label>Notes</label><textarea value={f.notes} onChange={e=>s('notes',e.target.value)}/></div>
      <div className="ma">
        <button className="tb-btn" onClick={onClose}>Cancel</button>
        <button className="tb-btn primary" onClick={()=>{if(f.foundation.trim()){onAdd(f);onClose();}}}>Add Grant</button>
      </div>
    </>
  );
}

// ── SUGGESTIONS MODAL ──
function SuggestionsModal({suggestions,onClose,onAccept,onReject}){
  return(
    <div className="mo" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <h3 style={{margin:0}}>Suggestions {suggestions.length>0&&<span style={{background:'var(--danger-bg)',color:'var(--danger)',padding:'2px 7px',fontSize:10,marginLeft:8}}>{suggestions.length}</span>}</h3>
          <button className="tb-iconbtn" onClick={onClose}>✕</button>
        </div>
        {suggestions.length===0?(
          <div style={{textAlign:'center',padding:'28px 0',color:'var(--ink-4)',fontSize:11,textTransform:'uppercase',letterSpacing:'.1em'}}>
            <div style={{fontSize:26,marginBottom:8,color:'var(--ink-5)'}}>[ ∅ ]</div>
            No pending suggestions
          </div>
        ):suggestions.map(s=>(
          <div key={s.id} style={{background:'var(--panel-2)',border:'1px solid var(--rule)',padding:'12px 14px',marginBottom:10}}>
            <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:14,marginBottom:2}}>{s.foundation}</div>
            {s.grant_name&&<div style={{fontSize:12,color:'var(--ink-3)',marginBottom:4}}>{s.grant_name}</div>}
            <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:10,color:'var(--ink-4)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.08em'}}>
              {s.deadline&&<span>DL {s.deadline}</span>}
              {s.web&&<a href={s.web} target="_blank" rel="noreferrer" style={{color:'var(--info)'}}>{s.web.replace(/^https?:\/\//,'').substring(0,30)}</a>}
              <span style={{marginLeft:'auto'}}>{new Date(s.submitted_at).toLocaleDateString()}</span>
            </div>
            {s.notes&&<div style={{fontSize:11,color:'var(--ink-2)',marginBottom:10,lineHeight:1.5,background:'var(--bg)',padding:'6px 8px'}}>{s.notes}</div>}
            <div style={{display:'flex',gap:8}}>
              <button className="tb-btn primary" style={{flex:1}} onClick={()=>onAccept(s)}>✓ Accept → Tracker</button>
              <button className="tb-btn" onClick={()=>onReject(s.id)}>✕ Discard</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── EDIT SHEET ──
function EditSheet({data,setData,search}){
  const [sortCol,setSortCol]=useState('foundation');
  const [sortDir,setSortDir]=useState('asc');
  const [colWidths,setColWidths]=useState({id:32,foundation:170,grant:150,projectDates:120,deadline:95,deadlineType:65,nextStep:75,amount:82,amountReceived:82,eligiblePeriod:130,reportDeadline:92,web:120,notes:140,del:26});
  const resizing=useRef(null);
  useEffect(()=>{
    const onMove=e=>{if(!resizing.current)return;const{col,startX,startW}=resizing.current;setColWidths(prev=>({...prev,[col]:Math.max(40,startW+(e.clientX-startX))}));};
    const onUp=()=>{resizing.current=null;document.body.style.cursor='';};
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  },[]);
  const startResize=(col,e)=>{e.stopPropagation();e.preventDefault();resizing.current={col,startX:e.clientX,startW:colWidths[col]};document.body.style.cursor='col-resize';};
  const rows=useMemo(()=>{
    let r=[...data];
    if(search){const q=search.toLowerCase();r=r.filter(g=>(g.foundation||'').toLowerCase().includes(q)||(g.grant||'').toLowerCase().includes(q)||(g.notes||'').toLowerCase().includes(q));}
    r.sort((a,b)=>{
      let va=a[sortCol]??'',vb=b[sortCol]??'';
      if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();
      if(va<vb)return sortDir==='asc'?-1:1;if(va>vb)return sortDir==='asc'?1:-1;return 0;
    });
    return r;
  },[data,search,sortCol,sortDir]);
  const upd=(id,key,val)=>setData(prev=>prev.map(g=>g.id===id?{...g,[key]:val}:g));
  const parsePeriodDates=(period)=>{
    if(!period)return{start:'',end:''};
    const pts=period.split(/\s*(?:–|—|to|-)\s*/);
    const toISO=(s)=>{const d=pDate(s);return d?d.toISOString().substring(0,10):''};
    return{start:toISO(pts[0]||''),end:pts.length>1?toISO(pts[pts.length-1]):''};
  };
  const updPeriod=(id,which,val)=>{
    setData(prev=>prev.map(g=>{
      if(g.id!==id)return g;
      const parts=(g.eligiblePeriod||'').split(/\s*(?:–|—|to|-)\s*/);
      let startStr=parts[0]||'',endStr=parts.length>1?parts[parts.length-1]:'';
      if(which==='start'){if(val){const d=new Date(val+'T00:00:00');startStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}else startStr='';}
      else{if(val){const d=new Date(val+'T00:00:00');endStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}else endStr='';}
      return{...g,eligiblePeriod:startStr&&endStr?`${startStr} – ${endStr}`:startStr||endStr};
    }));
  };
  const del=(id)=>{if(confirm('Delete this entry?'))setData(prev=>prev.filter(g=>g.id!==id));};
  const doSort=c=>{if(sortCol===c)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortCol(c);setSortDir('asc');}};
  const AR=({c})=><span style={{marginLeft:2,opacity:sortCol===c?1:.3,fontSize:7}}>{sortCol===c?(sortDir==='asc'?'▲':'▼'):'↕'}</span>;
  const RH=({col})=><div className="col-resize" onMouseDown={e=>startResize(col,e)}/>;
  return(
    <div className="sheet-wrap">
      <table className="sheet">
        <thead><tr>
          <th style={{width:colWidths.id}}>#</th>
          <th onClick={()=>doSort('foundation')} className={sortCol==='foundation'?'so':''} style={{width:colWidths.foundation}}>Foundation<AR c="foundation"/><RH col="foundation"/></th>
          <th onClick={()=>doSort('grant')} className={sortCol==='grant'?'so':''} style={{width:colWidths.grant}}>Grant Program<AR c="grant"/><RH col="grant"/></th>
          <th style={{width:colWidths.projectDates}}>Project<RH col="projectDates"/></th>
          <th onClick={()=>doSort('deadline')} className={sortCol==='deadline'?'so':''} style={{width:colWidths.deadline}}>Deadline<AR c="deadline"/><RH col="deadline"/></th>
          <th style={{width:colWidths.deadlineType}}>Type<RH col="deadlineType"/></th>
          <th onClick={()=>doSort('nextStep')} className={sortCol==='nextStep'?'so':''} style={{width:colWidths.nextStep}}>Status<AR c="nextStep"/><RH col="nextStep"/></th>
          <th onClick={()=>doSort('amount')} className={sortCol==='amount'?'so':''} style={{width:colWidths.amount}}>Requested<AR c="amount"/><RH col="amount"/></th>
          <th onClick={()=>doSort('amountReceived')} className={sortCol==='amountReceived'?'so':''} style={{width:colWidths.amountReceived}}>Received<AR c="amountReceived"/><RH col="amountReceived"/></th>
          <th style={{width:colWidths.eligiblePeriod}}>Period<RH col="eligiblePeriod"/></th>
          <th onClick={()=>doSort('reportDeadline')} className={sortCol==='reportDeadline'?'so':''} style={{width:colWidths.reportDeadline}}>Report DL<AR c="reportDeadline"/><RH col="reportDeadline"/></th>
          <th style={{width:colWidths.web}}>Link<RH col="web"/></th>
          <th style={{width:colWidths.notes}}>Notes<RH col="notes"/></th>
          <th style={{width:colWidths.del}}></th>
        </tr></thead>
        <tbody>
          {rows.map((g,i)=>{
            const pd=parsePeriodDates(g.eligiblePeriod);
            return(
              <tr key={g.id}>
                <td className="cell-id">{i+1}</td>
                <td className="cell-found"><textarea value={g.foundation||''} onChange={e=>upd(g.id,'foundation',e.target.value)} rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
                <td><textarea value={g.grant||''} onChange={e=>upd(g.id,'grant',e.target.value)} placeholder="—" rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
                <td><textarea value={g.projectDates||''} onChange={e=>upd(g.id,'projectDates',e.target.value)} placeholder="—" rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
                <td className="cell-date" onClick={ev=>{const inp=ev.currentTarget.querySelector('input');if(inp)inp.showPicker?.();}}><span className="date-disp">{g.deadline?fmtDateFull(g.deadline):'—'}</span><input type="date" value={g.deadline||''} onChange={e=>upd(g.id,'deadline',e.target.value)} className="date-hidden"/></td>
                <td><select value={g.deadlineType||'Estimated'} onChange={e=>upd(g.id,'deadlineType',e.target.value)}><option value="DDLNE!">Hard</option><option value="Estimated">Est.</option></select></td>
                <td><select value={g.nextStep||'02 Check'} onChange={e=>upd(g.id,'nextStep',e.target.value)} style={{fontSize:10}}>{STEPS.map(st=><option key={st} value={st}>{STEP_SHORT[st]}</option>)}</select></td>
                <td className="cell-amt"><input type="number" value={g.amount||''} onChange={e=>upd(g.id,'amount',e.target.value?parseFloat(e.target.value):null)} placeholder="—"/></td>
                <td className="cell-amt"><input type="number" value={g.amountReceived||''} onChange={e=>upd(g.id,'amountReceived',e.target.value?parseFloat(e.target.value):null)} placeholder="—"/></td>
                <td>
                  <div style={{display:'flex',gap:3}}>
                    <input type="date" value={pd.start} onChange={e=>updPeriod(g.id,'start',e.target.value)} style={{width:90}} title="Period start"/>
                    <input type="date" value={pd.end} onChange={e=>updPeriod(g.id,'end',e.target.value)} style={{width:90}} title="Period end"/>
                  </div>
                </td>
                <td className="cell-date" onClick={ev=>{const inp=ev.currentTarget.querySelector('input');if(inp)inp.showPicker?.();}}><span className="date-disp">{g.reportDeadline?fmtDateFull(g.reportDeadline):'—'}</span><input type="date" value={g.reportDeadline||''} onChange={e=>upd(g.id,'reportDeadline',e.target.value)} className="date-hidden"/></td>
                <td><textarea value={g.web||''} onChange={e=>upd(g.id,'web',e.target.value)} placeholder="https://..." rows={1} style={{fontSize:10}} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
                <td><textarea value={g.notes||''} onChange={e=>upd(g.id,'notes',e.target.value)} placeholder="—" rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/></td>
                <td className="cell-del"><button onClick={()=>del(g.id)} title="Delete">✕</button></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── APP ──
function App({initialGrants}){
  const [data,setData]=useState(()=>initialGrants.map(g=>({...g})));
  const [view,setView]=useState('today');
  const [openGroup,setOpenGroup]=useState(null);
  const [search,setSearch]=useState('');
  const [statusFilter,setStatusFilter]=useState('all');
  const [showAdd,setShowAdd]=useState(false);
  const [showSuggestions,setShowSuggestions]=useState(false);
  const [showEditSheet,setShowEditSheet]=useState(false);
  const [isDark,setIsDark]=useState(true);
  const [suggestions,setSuggestions]=useState([]);
  const [saveStatus,setSaveStatus]=useState('ok');
  const [lastSaved,setLastSaved]=useState(null);

  useEffect(()=>{document.documentElement.classList.toggle('light',!isDark);},[isDark]);
  useEffect(()=>{loadSuggestions().then(setSuggestions);},[]);

  const saveTimer=useRef(null);
  const firstRender=useRef(true);
  useEffect(()=>{
    if(firstRender.current){firstRender.current=false;return;}
    setSaveStatus('saving');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      const r=await saveToServer(data);
      if(r.ok){setSaveStatus('ok');setLastSaved(new Date());}
      else setSaveStatus('err');
    },2000);
    return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);};
  },[data]);

  const groups=useMemo(()=>computeProgramGroups(data),[data]);

  const urgentCount=groups.filter(g=>{if(g.status!=='drafting')return false;const d=daysUntilDate(g.deadline);return d!=null&&d<=7;}).length;
  const pendingAmt=groups.filter(g=>g.status==='submitted').reduce((s,g)=>s+(g.amount||0),0);
  const ytdAwarded=groups.filter(g=>g.status==='awarded').reduce((s,g)=>s+(g.amountReceived||0),0);
  const now=new Date();
  const activeCount=data.filter(g=>{if(g.nextStep!=='05 Received')return false;const p=parsePeriod(g.eligiblePeriod);return p&&now>=p.start&&now<=p.end;}).length;
  const reportsSoon=groups.filter(g=>g.status==='awarded'&&g.reportDeadline&&(daysUntilDate(g.reportDeadline)||999)<=60&&(daysUntilDate(g.reportDeadline)||999)>=0).length;

  const tabs=[
    {id:'today',label:'Today',count:groups.filter(g=>g.status==='drafting'||g.status==='submitted').length,urgent:urgentCount>0},
    {id:'library',label:'Library',count:groups.length},
    {id:'active',label:'Active',count:activeCount},
    {id:'calendar',label:'Calendar',count:groups.filter(g=>g.deadline&&parseDate(g.deadline)>=now).length},
    {id:'insights',label:'Insights'},
  ];

  const changeField=useCallback((id,field,val)=>setData(p=>p.map(g=>g.id===id?{...g,[field]:val}:g)),[]);
  const add=useCallback(g=>setData(p=>[g,...p]),[]);
  const handleAccept=useCallback(async(sug)=>acceptSuggestion(sug,add,setSuggestions),[add]);
  const handleReject=useCallback(async(id)=>rejectSuggestion(id,setSuggestions),[]);

  return(
    <div className="app">
      <div className="tbar">
        <div className="tb-brand">
          <div className="tb-logo"/>
          <div className="tb-name">POLEN</div>
          <div className="tb-tag">v3</div>
        </div>
        <div className="tb-stats">
          <div className="tb-stat"><div className="tb-stat-label">DUE ≤7D</div><div className={`tb-stat-val ${urgentCount>0?'urgent':''}`}>{urgentCount}</div></div>
          <div className="tb-stat"><div className="tb-stat-label">PENDING</div><div className="tb-stat-val accent">${fmtMoney(pendingAmt)}</div></div>
          <div className="tb-stat"><div className="tb-stat-label">AWARDED YTD</div><div className="tb-stat-val ok">${fmtMoney(ytdAwarded)}</div></div>
          <div className="tb-stat"><div className="tb-stat-label">ACTIVE</div><div className="tb-stat-val">{activeCount} <span className="x">/ grants</span></div></div>
          <div className="tb-stat"><div className="tb-stat-label">RPT ≤60D</div><div className={`tb-stat-val ${reportsSoon>0?'warn':''}`}>{reportsSoon}</div></div>
        </div>
        <div className="tb-actions">
          <button className="tb-btn primary" onClick={()=>setShowAdd(true)}>+ NEW</button>
          <button className="tb-iconbtn" onClick={()=>setShowEditSheet(true)} title="Edit all data" style={{fontSize:15}}>⊟</button>
          <div style={{position:'relative'}}>
            <button className="tb-iconbtn" onClick={()=>setShowSuggestions(true)} title="Suggestions">✉</button>
            {suggestions.length>0&&<span className="tb-badge">{suggestions.length}</span>}
          </div>
          <button className="tb-iconbtn" onClick={()=>setIsDark(d=>!d)} title="Theme">{isDark?'☼':'☾'}</button>
          <button className="tb-iconbtn" onClick={doSignOut} title="Sign out" style={{fontSize:15}}>⎋</button>
        </div>
      </div>

      <div className="tabs">
        {tabs.map(tab=>(
          <button key={tab.id} className={`tab ${view===tab.id?'active':''}`} onClick={()=>setView(tab.id)}>
            {tab.urgent&&view!==tab.id&&<span className="pulse"/>}
            {tab.label.toUpperCase()}
            {tab.count!=null&&<span className="num">[{tab.count}]</span>}
          </button>
        ))}
        <div className="tab-spacer"/>
        {view==='library'&&(
          <div className="tab-right">
            <span style={{color:'var(--ink-4)'}}>/</span>
            <input className="tab-search" placeholder="search..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
        )}
        <div className="tab-right">
          <span style={{color:'var(--ink-4)'}}>USER</span>
          <span style={{color:'var(--ink-2)'}}>creartbox</span>
        </div>
      </div>

      <div className="main">
        {view==='today'&&<TodayView groups={groups} onOpen={setOpenGroup}/>}
        {view==='library'&&<ListView groups={groups} onOpen={setOpenGroup} search={search} setSearch={setSearch} statusFilter={statusFilter} setStatusFilter={setStatusFilter}/>}
        {view==='active'&&<ActiveView data={data} groups={groups} onOpen={setOpenGroup}/>}
        {view==='calendar'&&<CalendarView groups={groups} onOpen={setOpenGroup}/>}
        {view==='insights'&&<InsightsView groups={groups}/>}
      </div>

      <div className="fbar">
        <span><span className="dot" style={{background:saveStatus==='err'?'var(--danger)':saveStatus==='saving'?'var(--warn)':'var(--ok)'}}/> {saveStatus==='ok'?'ONLINE':saveStatus==='saving'?'SAVING…':'ERROR'}</span>
        <span>POLEN v3</span>
        <span>{new Date().toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'}).toUpperCase()}</span>
        <div className="right">
          <span>{data.length} ENTRIES</span>
          <span>·</span>
          <span>{view.toUpperCase()}</span>
          {lastSaved&&<span>· SAVED {lastSaved.toLocaleTimeString()}</span>}
        </div>
      </div>

      {openGroup&&<Drawer g={openGroup} onClose={()=>setOpenGroup(null)} onChangeField={changeField}/>}

      {showAdd&&(
        <div className="mo" onClick={()=>setShowAdd(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <AddModal onClose={()=>setShowAdd(false)} onAdd={add}/>
          </div>
        </div>
      )}

      {showSuggestions&&<SuggestionsModal suggestions={suggestions} onClose={()=>setShowSuggestions(false)} onAccept={handleAccept} onReject={handleReject}/>}

      {showEditSheet&&(
        <div className="sheet-mo">
          <div className="sheet-mo-head">
            <span className="title">DATA EDITOR</span>
            <span style={{fontSize:10,color:'var(--ink-4)'}}>{data.length} entries</span>
            <div style={{marginLeft:'auto',display:'flex',gap:8}}>
              <button className="tb-btn" onClick={async()=>{const r=await saveToServer(data);if(r.ok){setSaveStatus('ok');setLastSaved(new Date());}}} style={{borderColor:'var(--ok)',color:'var(--ok)'}}>💾 Save</button>
              <button className="tb-btn" onClick={()=>exportJSON(data)} style={{color:'var(--info)'}}>⬇ Export</button>
              <label className="tb-btn" style={{cursor:'pointer',color:'var(--warn)'}}>⬆ Import<input type="file" accept=".json" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){setData(d);}}catch(err){alert('Invalid JSON');}};rd.readAsText(f);e.target.value='';}}/>
              </label>
              <button className="tb-btn primary" onClick={()=>setShowEditSheet(false)}>Close</button>
            </div>
          </div>
          <div className="sheet-mo-body">
            <EditSheet data={data} setData={setData} search=""/>
          </div>
        </div>
      )}
    </div>
  );
}

function startApp(data){
  const root=ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App initialGrants={data}/>);
}

async function boot(){
  if(window._appStarted)return;
  const {data:{session}}=await _sb.auth.getSession();
  if(session){
    window._appStarted=true;
    showLoading();
    const grants=await loadFromSupabase();
    hideLoading();
    startApp(grants);
  } else {
    document.getElementById('login-overlay').style.display='flex';
  }
}
boot();
</script>
