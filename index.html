      </div>
      <div className="sugg-notes-area">
        {editingNotes
          ?<textarea autoFocus className="sugg-notes-input" value={notes}
              onChange={e=>setNotes(e.target.value)}
              onBlur={()=>setEditingNotes(false)}/>
          :<div className="sugg-notes-view" onClick={()=>setEditingNotes(true)}>
              {notes||<em>Add note…</em>}
            </div>
        }
      </div>
      <div className="sugg-actions">
        {web&&<a href={web} target="_blank" rel="noreferrer" className="sugg-link-btn" onClick={e=>e.stopPropagation()}><i className="fa-solid fa-arrow-up-right-from-square"/> Link</a>}
        <button className="btn btn-pri sugg-btn-accept" onClick={()=>onAccept(enriched)}><i className="fa-solid fa-check"/> Accept</button>
        <button className="btn btn-sec sugg-btn-rej" onClick={()=>onReject(s.id)}><i className="fa-solid fa-xmark"/></button>
      </div>
    </div>
  );
}
function SuggestionsView({suggestions,onAccept,onReject}){
  if(suggestions.length===0)return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'60px 20px',gap:12,color:'var(--tf)'}}>
      <div style={{fontSize:32}}>🤖</div>
      <div style={{fontSize:13,fontWeight:600}}>No pending suggestions</div>
      <div style={{fontSize:11,color:'var(--tf)',textAlign:'center',maxWidth:340,lineHeight:1.6}}>
        When ChatGPT adds grants via the Action, they'll appear here for review.
      </div>
    </div>
  );
  return(
    <div className="sugg-list">
      {suggestions.map((s,i)=><SuggestionCard key={s.id} s={s} i={i} onAccept={onAccept} onReject={onReject}/>)}
    </div>
  );
}

// ── APP ──
function App({initialGrants}){
  const[data,setData]=useState(()=>initialGrants.map(g=>({...g})));
  const[saveMsg,setSaveMsg]=useState(null);
  const[lastSaved,setLastSaved]=useState(null);
  const[saveStatus,setSaveStatus]=useState('ok'); // ok, local, err
  const[search,setSearch]=useState('');
  const[statusFilter,setStatusFilter]=useState('all');
  const[showAdd,setShowAdd]=useState(false);
  const[addPrefill,setAddPrefill]=useState(null);
  const[editMode,setEditMode]=useState(false);
  const[activeView,setActiveView]=useState(false); // "Active Grants" view
  const[calendarView,setCalendarView]=useState(false); // "Upcoming/Calendar" view
  const[isDark,setIsDark]=useState(()=>localStorage.getItem('polen-theme')==='dark');
  const[suggestions,setSuggestions]=useState([]);
  const[showSuggestions,setShowSuggestions]=useState(false);
  const[suggView,setSuggView]=useState(false);
  useEffect(()=>{document.documentElement.classList.toggle('light',!isDark);},[isDark]);
  useEffect(()=>{loadSuggestions().then(setSuggestions);},[]);

  // Auto-save: localStorage instantly + server after 2s debounce
  const saveTimer=useRef(null);
  const firstRender=useRef(true);
  useEffect(()=>{
    if(firstRender.current){firstRender.current=false;return;}
    setLastSaved(new Date());
    setSaveStatus('saving');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      const r=await saveToServer(data);
      if(r.ok){setSaveStatus('ok');setLastSaved(new Date());setSaveMsg(null);}
      else{setSaveStatus('local');setSaveMsg(r.msg);}
    },2000);
    return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);};
  },[data]);

  // Group entries by grant program (foundation + grant combo)
  const programGroups=useMemo(()=>{
    // Group ALL entries first — status filter applied at group level so full history is visible when expanded
    const groups={};
    data.forEach(g=>{
      const key=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();
      if(!groups[key])groups[key]={key,foundation:(g.foundation||'').trim(),grant:(g.grant||'').trim(),entries:[]};
      groups[key].entries.push(g);
    });
    const now=new Date();now.setHours(0,0,0,0);
    // For each group, compute stats and find next deadline
    let result=Object.values(groups).map(grp=>{
      grp.entries.sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||'')); // newest first
      const futureEntries=grp.entries.filter(e=>e.deadline&&new Date(e.deadline+'T00:00:00')>=now).sort((a,b)=>a.deadline.localeCompare(b.deadline));
      grp.nextDeadline=futureEntries[0]||null;
      grp.primary=grp.entries[0];
      grp.received=grp.entries.filter(e=>e.nextStep==='05 Received').length;
      grp.denied=grp.entries.filter(e=>e.nextStep==='04 Denied').length;
      grp.waiting=grp.entries.filter(e=>e.nextStep==='03 Waiting Results').length;
      grp.totalAmtByCur={};
      grp.entries.filter(e=>e.nextStep==='05 Received').forEach(e=>{const c=e.currency||'USD';grp.totalAmtByCur[c]=(grp.totalAmtByCur[c]||0)+(e.amountReceived||e.amount||0);});
      grp.totalAmt=Object.values(grp.totalAmtByCur).reduce((s,v)=>s+v,0);
      return grp;
    });
    // Filter groups by status of their most recent (primary) entry
    if(statusFilter==='apply')result=result.filter(grp=>grp.primary.nextStep==='01 Apply on deadline'||grp.primary.nextStep==='00 Send Proposal');
    else if(statusFilter!=='all')result=result.filter(grp=>grp.primary.nextStep===statusFilter);
    // Search: match any entry's foundation, grant, notes, or projectDates
    if(search){
      const q=search.toLowerCase();
      result=result.filter(grp=>(grp.foundation||'').toLowerCase().includes(q)||(grp.grant||'').toLowerCase().includes(q)||grp.entries.some(e=>(e.notes||'').toLowerCase().includes(q)||(e.projectDates||'').toLowerCase().includes(q)));
    }
    return result.sort((a,b)=>{
      // Groups with future deadlines first (soonest), then past (most recent)
      const aD=a.nextDeadline?a.nextDeadline.deadline:'9999';
      const bD=b.nextDeadline?b.nextDeadline.deadline:'9999';
      const aFut=a.nextDeadline&&new Date(aD+'T00:00:00')>=now;
      const bFut=b.nextDeadline&&new Date(bD+'T00:00:00')>=now;
      if(aFut&&!bFut)return -1;
      if(!aFut&&bFut)return 1;
      if(aFut&&bFut)return aD.localeCompare(bD);
      // Both past: most recent first
      const aR=a.primary.deadline||'';
      const bR=b.primary.deadline||'';
      return bR.localeCompare(aR);
    });
  },[data,statusFilter,search]);

  // Active Grants: awarded + currently within grant period
  const activeGrants=useMemo(()=>{
    const now=new Date();
    return data.filter(g=>{
      if(g.nextStep!=='05 Received')return false;
      const p=pPeriod(g.eligiblePeriod);
      if(!p)return false; // no period = can't determine if active
      return now>=p.start&&now<=p.end;
    }).sort((a,b)=>{
      // Sort by period end date (soonest ending first)
      const pa=pPeriod(a.eligiblePeriod), pb=pPeriod(b.eligiblePeriod);
      return(pa?pa.end:new Date('9999'))-(pb?pb.end:new Date('9999'));
    });
  },[data]);

  // Calendar view: only shows grant programs that have an explicit season field
  const calendarData=useMemo(()=>{
    const SEASONS=[
      {key:'Spring',name:'Spring',emoji:'🌱'},
      {key:'Summer',name:'Summer',emoji:'☀️'},
      {key:'Fall',name:'Fall',emoji:'🍂'},
      {key:'Winter',name:'Winter',emoji:'❄️'},
      {key:'Closed',name:'Closed',emoji:'🚫'}
    ];
    const seasonKeyToIdx={Spring:0,Summer:1,Fall:2,Winter:3,Closed:4};
    const monthToSeason=m=>m>=2&&m<=4?0:m>=5&&m<=7?1:m>=8&&m<=10?2:3;
    const curYear=new Date().getFullYear();
    // Build program map — only include entries that have a season field
    const progMap={};
    data.forEach(g=>{
      const hasSeason=g.season&&seasonKeyToIdx[g.season]!==undefined;
      const key=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();
      // Initialize program if any entry of it has a season
      if(hasSeason&&!progMap[key])progMap[key]={foundation:(g.foundation||'').trim(),grant:(g.grant||'').trim(),entries:[],web:g.web||'',bases:g.bases||'',season:g.season};
      // If program already exists (season was set on another entry), also collect this entry for history
      if(progMap[key]){
        if(g.deadline){
          const d=new Date(g.deadline+'T00:00:00');
          progMap[key].entries.push({month:d.getMonth(),day:d.getDate(),year:d.getFullYear(),status:g.nextStep,amount:g.amountReceived||g.amount||0,deadline:g.deadline,deadlineType:g.deadlineType||''});
        }
        if(g.web&&!progMap[key].web)progMap[key].web=g.web;
        if(g.bases&&!progMap[key].bases)progMap[key].bases=g.bases;
        if(hasSeason)progMap[key].season=g.season;
      }
    });
    const bySeason=[[],[],[],[],[]];
    Object.values(progMap).forEach(prog=>{
      if(!prog.season||seasonKeyToIdx[prog.season]===undefined)return;
      const si=seasonKeyToIdx[prog.season];
      const received=prog.entries.filter(e=>e.status==='05 Received').length;
      const totalApps=prog.entries.length;
      const rate=totalApps>0?Math.round(received/totalApps*100):0;
      const totalAmt=prog.entries.filter(e=>e.status==='05 Received').reduce((s,e)=>s+e.amount,0);
      const history=prog.entries.slice().sort((a,b)=>a.year-b.year||a.month-b.month);
      const thisYearEntries=prog.entries.filter(e=>e.year===curYear);
      const trackedStatuses=['01 Apply on deadline','00 Send Proposal','03 Waiting Results','05 Received','04 Denied','08 Not Eligible'];
      const isTracked=thisYearEntries.some(e=>trackedStatuses.includes(e.status));
      // Skip if already tracked this year (apply/waiting/received/denied)
      if(isTracked)return;
      // Compute last known deadline for reference
      const lastEntry=history.length>0?history[history.length-1]:null;
      const lastDeadline=lastEntry?lastEntry.deadline:null;
      const lastDLType=lastEntry?lastEntry.deadlineType:'';
      const lastMonth=lastEntry?lastEntry.month:null;
      const lastDay=lastEntry?lastEntry.day:null;
      const lastYear=lastEntry?lastEntry.year:null;
      // Estimated next deadline based on historical avg
      const avgMonth=lastMonth;
      const avgDay=lastDay;
      bySeason[si].push({
        foundation:prog.foundation,grant:prog.grant,web:prog.web,
        totalApps,received,rate,totalAmt,history,
        lastDeadline,lastDLType,lastMonth,lastDay,lastYear,avgMonth,avgDay
      });
    });
    bySeason.forEach(arr=>arr.sort((a,b)=>(a.foundation||'').localeCompare(b.foundation||'')));
    const now=new Date();
    const curSeason=monthToSeason(now.getMonth());
    const result=[];
    for(let i=0;i<4;i++){
      const si=(curSeason+i)%4;
      const s=SEASONS[si];
      if(bySeason[si].length>0){
        result.push({...s,isCurrent:si===curSeason,isNext:si===(curSeason+1)%4,grants:bySeason[si]});
      }
    }
    // Closed always at the end
    if(bySeason[4].length>0){
      result.push({...SEASONS[4],isCurrent:false,isNext:false,grants:bySeason[4]});
    }
    return result;
  },[data]);

  const stats=useMemo(()=>({
    total:data.length,
    apply:data.filter(g=>g.nextStep==='01 Apply on deadline'||g.nextStep==='00 Send Proposal').length,
    waiting:data.filter(g=>g.nextStep==='03 Waiting Results').length,
    waitingAmtByCur:(()=>{const m={};data.filter(g=>g.nextStep==='03 Waiting Results').forEach(g=>{const c=g.currency||'USD';m[c]=(m[c]||0)+(g.amount||0);});return m;})(),
    received:data.filter(g=>g.nextStep==='05 Received').length,
    denied:data.filter(g=>g.nextStep==='04 Denied').length,
    active:activeGrants.length,
    totalAmt:data.filter(g=>g.nextStep==='05 Received').reduce((s,g)=>s+(g.amountReceived||g.amount||0),0),
    activeAmt:activeGrants.reduce((s,g)=>s+(g.amountReceived||g.amount||0),0),
  }),[data,activeGrants]);

  const changeStatus=useCallback((id,newStep)=>setData(p=>p.map(g=>g.id===id?{...g,nextStep:newStep}:g)),[]);
  const changeField=useCallback((id,field,val)=>setData(p=>p.map(g=>g.id===id?{...g,[field]:val}:g)),[]);
  const changeProgramSeason=useCallback((foundation,grant,newSeason)=>{
    const f=(foundation||'').trim(), gr=(grant||'').trim();
    setData(p=>p.map(g=>(g.foundation||'').trim()===f&&(g.grant||'').trim()===gr?{...g,season:newSeason}:g));
  },[]);
  const add=useCallback(g=>setData(p=>[g,...p]),[]);
  const delEntry=useCallback(id=>{if(confirm('Delete this grant entry?'))setData(p=>p.filter(g=>g.id!==id));},[]);
  const dupEntry=useCallback(id=>{setData(p=>{const src=p.find(g=>g.id===id);if(!src)return p;const copy={...src,id:Date.now(),notes:(src.notes||'')+' (copy)'};return[copy,...p];});},[]);
  const[expRow,setExpRow]=useState(null);

  return(
    <div className="app">
      <div className="topbar">
        <span className="nav-brand">POLEN</span>
        <div style={{flex:1}}/>
        <div className="topbar-actions">
          <button className={`theme-btn${editMode?' edit-active':''}`} title="Edit All" onClick={()=>{setEditMode(v=>!v);setActiveView(false);setCalendarView(false);setSuggView(false);}} style={editMode?{borderColor:'var(--y)',color:'var(--y)',background:'var(--ybg)'}:{}}><i className="fa-solid fa-pen"/></button>
          {editMode&&<>
            <button className="theme-btn" title="Save" onClick={async()=>{const r=await saveToServer(data);setSaveMsg(r.msg);setTimeout(()=>setSaveMsg(null),2500);}} style={{borderColor:'var(--g)',color:'var(--g)',background:'var(--gbg)'}}><i className="fa-solid fa-floppy-disk"/></button>
            <button className="theme-btn" title="Export JSON" onClick={()=>exportJSON(data)} style={{borderColor:'var(--b)',color:'var(--b)'}}><i className="fa-solid fa-download"/></button>
            <label className="theme-btn" title="Import JSON" style={{borderColor:'var(--y)',color:'var(--y)',cursor:'pointer'}}><i className="fa-solid fa-upload"/><input type="file" accept=".json" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){setData(d);setSaveMsg('Imported '+d.length);setTimeout(()=>setSaveMsg(null),2000);}}catch(err){alert('Invalid JSON');}};rd.readAsText(f);e.target.value='';}}/></label>
            {saveMsg&&<span style={{fontSize:10,color:'var(--g)',fontWeight:700}}>{saveMsg}</span>}
          </>}
          <span style={{width:1,height:16,background:'var(--bd)',margin:'0 2px',flexShrink:0}}/>
          <button className="theme-btn btn-reload" onClick={()=>window.location.reload()} title="Reload"><i className="fa-solid fa-rotate-right"/></button>
          <button className="theme-btn btn-signout" onClick={doSignOut} title="Sign out"><i className="fa-solid fa-right-from-bracket"/></button>
          <button className="theme-btn" title="Toggle theme" onClick={()=>{setIsDark(d=>{const n=!d;localStorage.setItem('polen-theme',n?'dark':'light');return n;})}}>{isDark?<i className="fa-solid fa-sun"/>:<i className="fa-solid fa-moon"/>}</button>
          <button className="btn btn-pri" onClick={()=>setShowAdd(true)}>+ Add</button>
        </div>
      </div>

      <div className="filters">
        <input className="search" placeholder="Search foundation, grant program, notes..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <div className="chips-row">
          {/* Desktop: individual pills */}
          {[['all','All',stats.total,null],['apply','Apply',stats.apply,null],['03 Waiting Results','Waiting',stats.waiting,stats.waitingAmtByCur],['05 Received','Awarded',stats.received,null],['04 Denied','Denied',stats.denied,null]].map(([k,l,c,amtByCur])=>
            <button key={k} className={`chip status-chip-desktop ${statusFilter===k&&!editMode&&!activeView&&!calendarView&&!suggView?'on':''}`}
              onClick={()=>{setStatusFilter(k);setEditMode(false);setActiveView(false);setCalendarView(false);setSuggView(false);setExpRow(null);}}>
              {l}{k!=='all'&&c>0&&<span style={{opacity:.65,marginLeft:4,fontSize:10}}>{c}</span>}{amtByCur&&Object.values(amtByCur).some(v=>v>0)&&<span style={{opacity:.55,marginLeft:4,fontSize:9}}>{fmtByCur(amtByCur)}</span>}
            </button>
          )}
          {/* Mobile: dropdown */}
          <div className={`chip-sel-wrap status-sel-mobile${statusFilter!=='all'&&!editMode&&!activeView&&!calendarView&&!suggView?' active':''}`}>
            <select className={`chip-sel${statusFilter!=='all'&&!editMode&&!activeView&&!calendarView&&!suggView?' active':''}`}
              value={statusFilter}
              onChange={e=>{setStatusFilter(e.target.value);setEditMode(false);setActiveView(false);setCalendarView(false);setSuggView(false);setExpRow(null);}}>
              <option value="all">All ({stats.total})</option>
              <option value="apply">Apply ({stats.apply})</option>
              <option value="03 Waiting Results">Waiting ({stats.waiting})</option>
              <option value="05 Received">Awarded ({stats.received})</option>
              <option value="04 Denied">Denied ({stats.denied})</option>
            </select>
          </div>
          <button className={`chip ${activeView&&!editMode&&!calendarView&&!suggView?'on':''}`} onClick={()=>{setActiveView(!activeView);setEditMode(false);setCalendarView(false);setSuggView(false);setExpRow(null);}} style={activeView?{background:'var(--gbg)',color:'var(--g)'}:{}}><i className="fa-solid fa-bolt"/> Active ({stats.active})</button>
          <button className={`chip ${calendarView&&!editMode&&!suggView?'on':''}`} onClick={()=>{setCalendarView(!calendarView);setEditMode(false);setActiveView(false);setSuggView(false);setExpRow(null);}} style={calendarView?{background:'var(--obg)',color:'var(--o)'}:{}}><i className="fa-solid fa-calendar-days"/> Upcoming{calendarData.reduce((s,m)=>s+m.grants.length,0)>0&&<span style={{marginLeft:5,background:'var(--o)',color:'#fff',borderRadius:10,padding:'0 6px',fontSize:10,fontWeight:800}}>{calendarData.reduce((s,m)=>s+m.grants.length,0)}</span>}</button>
          <button className={`chip ${suggView?'on':''}`} onClick={()=>{setSuggView(v=>!v);setEditMode(false);setActiveView(false);setCalendarView(false);setExpRow(null);}} style={suggView?{background:'var(--bbg)',color:'var(--b)'}:{}}>
            <i className="fa-solid fa-robot"/> IA{suggestions.length>0&&<span style={{marginLeft:5,background:'var(--r)',color:'#fff',borderRadius:10,padding:'0 6px',fontSize:10,fontWeight:800}}>{suggestions.length}</span>}
          </button>
        </div>
        <span style={{fontSize:11,color:'var(--tf)',marginLeft:'auto',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {editMode?`${data.length} entries`:suggView?`${suggestions.length} sugerencias IA pendientes`:calendarView?`${calendarData.reduce((s,m)=>s+m.grants.length,0)} programs · ${calendarData.length} seasons`:activeView?`${activeGrants.length} active · ${fmt(stats.activeAmt)}`:(()=>{
            const reqByCur={};programGroups.forEach(g=>{if(g.primary.amount){const c=g.primary.currency||'USD';reqByCur[c]=(reqByCur[c]||0)+g.primary.amount;}});
            const wonByCur={};programGroups.forEach(g=>Object.entries(g.totalAmtByCur).forEach(([c,v])=>{wonByCur[c]=(wonByCur[c]||0)+v;}));
            const reqStr=fmtByCur(reqByCur)!=='—'?fmtByCur(reqByCur):'';
            const wonStr=fmtByCur(wonByCur)!=='—'?fmtByCur(wonByCur):'';
            return <>{`${programGroups.length} programs · ${programGroups.reduce((s,g)=>s+g.entries.length,0)} grants`}{reqStr&&<span style={{borderLeft:'1px solid var(--bd)',paddingLeft:8}}>req <strong style={{color:'var(--td)'}}>{reqStr}</strong></span>}{wonStr&&<span>· won <strong style={{color:'var(--g)'}}>{wonStr}</strong></span>}</>;
          })()}
          {lastSaved&&<span className="save-indicator"><span className={`dot ${saveStatus}`}/>{saveStatus==='ok'?'Saved':saveStatus==='saving'?'Saving...':'Error'} · {lastSaved.toLocaleTimeString()}</span>}
        </span>
      </div>

      <div className="main-area">
        {editMode?(
          <EditSheet data={data} setData={setData} search={search}/>
        ):suggView?(
          <SuggestionsView suggestions={suggestions} onAccept={s=>acceptSuggestion(s,add,setSuggestions)} onReject={id=>rejectSuggestion(id,setSuggestions)}/>
        ):calendarView?(
          <div className="cal-view">
            {calendarData.length===0?(
              <div className="cal-empty">
                <div className="cal-empty-icon">✓</div>
                All grant programs are tracked for {new Date().getFullYear()}. Nothing to check.
              </div>
            ):calendarData.map(se=>(
              <div key={se.name} className={`cal-season${se.key==='Closed'?' closed':''}`}>
                <div className="cal-season-hdr">
                  <span className={`cal-season-name ${se.isCurrent?'current':se.isNext?'next':''}`}>{se.emoji} {se.name}</span>
                  <span className="cal-season-count">{se.grants.length}</span>
                  {se.isCurrent&&<span className="cal-season-tag">Now</span>}
                  {se.isNext&&<span className="cal-season-tag" style={{background:'var(--ybg)',color:'var(--y)'}}>Next</span>}
                </div>
                {se.grants.map((g,gi)=>{
                  const goToTimeline=()=>{const k=(g.foundation||'').trim()+'|||'+(g.grant||'').trim();setCalendarView(false);setStatusFilter('all');setSearch('');setExpRow(k);};
                  const MSHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                  return(
                  <div key={gi} className="cal-grant" onClick={goToTimeline}>
                    <div className="cg-top">
                      <div>
                        <div className="cg-foundation">{g.foundation}</div>
                        <div className="cg-program">{g.grant||'—'}</div>
                      </div>
                      <div className="cg-top-right">
                        <select className="cg-season-sel" value={se.key} onClick={e=>e.stopPropagation()} onChange={e=>{e.stopPropagation();changeProgramSeason(g.foundation,g.grant,e.target.value);}}>
                          <option value="Spring">Spring</option><option value="Summer">Summer</option><option value="Fall">Fall</option><option value="Winter">Winter</option><option value="Closed">Closed</option>
                        </select>
                        <span className="cg-chevron">›</span>
                      </div>
                    </div>
                    {g.lastDeadline&&(
                      <div className="cg-meta">
                        <div className="cg-meta-item"><span className="label">Last deadline</span> <span className="val">{MSHORT[g.lastMonth]} {g.lastDay}, {g.lastYear}</span></div>
                        <span className={`cg-dl-type ${g.lastDLType==='DDLNE!'?'hard':'est'}`}>{g.lastDLType==='DDLNE!'?'HARD':'EST'}</span>
                        {g.totalAmt>0&&<div className="cg-meta-item"><span className="label">Won</span> <span className="val" style={{color:'var(--g)'}}>{fmt(g.totalAmt)}</span></div>}
                      </div>
                    )}
                    <div className="cg-bottom">
                      <div className="cg-history">
                        {g.history.map((h,hi)=>{
                          const cls=h.status==='05 Received'?'received':h.status==='04 Denied'?'denied':h.status==='03 Waiting Results'?'waiting':h.status==='07 Missed Deadline'?'missed':h.status==='08 Not Eligible'?'notelig':'check';
                          return <span key={hi} className="cg-yr"><span className={`sem-dot ${cls}`}/>{String(h.year).slice(-2)}</span>;
                        })}
                        <span className="cg-rate">{g.received}/{g.totalApps}</span>
                      </div>
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <a className="cg-search-btn" href={'https://www.google.com/search?q='+encodeURIComponent((g.foundation||'')+' '+(g.grant||'')+' grant '+new Date().getFullYear())} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} title="Search on Google">🔍</a>
                        {g.web&&<a className="cg-web-btn" href={g.web} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} title="Open website"><i className="fa-solid fa-arrow-up-right-from-square"/></a>}
                        <button className="cg-add-btn" onClick={e=>{e.stopPropagation();setAddPrefill({foundation:g.foundation,grant:g.grant,web:g.web||'',season:se.key});setShowAdd(true);}}>
                          + Add {new Date().getFullYear()}
                        </button>
                      </div>
                    </div>
                  </div>
                );})}
              </div>
            ))}
          </div>
        ):activeView?(
          <div className="active-grid">
            {activeGrants.length===0?(
              <div style={{textAlign:'center',padding:40,color:'var(--tf)'}}>No active grants with a defined grant period right now.</div>
            ):activeGrants.map(g=>{
              const p=pPeriod(g.eligiblePeriod);
              const daysLeft=p?Math.ceil((p.end-new Date())/864e5):null;
              return(
                <div key={g.id} className="active-card">
                  <div className="ac-top">
                    <div className="ac-info">
                      <div className="ac-foundation">{g.foundation}<CopyBtn text={g.foundation}/></div>
                      <div className="ac-grant">{g.grant||'—'}{g.grant&&<CopyBtn text={g.grant}/>}</div>
                      {g.projectDates&&<div className="ac-project">{g.projectDates}</div>}
                    </div>
                    <div className="ac-amounts">
                      <div className="ac-amt">{fmt(g.amountReceived||g.amount)}</div>
                      {daysLeft!=null&&<div className="ac-days" style={{color:daysLeft<=30?'var(--r)':daysLeft<=90?'var(--y)':'var(--g)'}}>{daysLeft}d left</div>}
                      {g.reportDeadline&&<div className="ac-report">Report: {fmtDateShort(g.reportDeadline)}</div>}
                    </div>
                  </div>
                  <Thermo period={g.eligiblePeriod} deadline={g.deadline} reportDeadline={g.reportDeadline}/>
                  {g.notes&&<div className="ac-notes">{g.notes}</div>}
                </div>
              );
            })}
          </div>
        ):(
          <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
          <table className="flat-table">
            <thead><tr>
              <th style={{width:110}}>Deadline</th>
              <th>Foundation</th>
              <th>Grant Program</th>
              <th style={{width:75}}>Status</th>
              <th style={{width:60}}>Apps</th>
              <th style={{width:80}}>Results</th>
              <th style={{width:80}}>Requested</th>
              <th style={{width:80}}>Won</th>
              <th style={{width:120}}></th>
            </tr></thead>
            <tbody>
              {programGroups.map(grp=>{
                const nd=grp.nextDeadline||grp.primary;
                const days=nd&&nd.deadline?daysUntil(nd.deadline):9999;
                const dc=dlClass(days);
                const isExp=expRow===grp.key;
                const relStr=days<0?`${Math.abs(days)}d ago`:days===0?'Today':days<=60?`${days}d`:`${Math.round(days/30)}mo`;
                const latestStep=grp.primary.nextStep;
                const dType=nd?nd.deadlineType:'';
                // Semáforo: year history dots
                const semEntries=grp.entries.slice().sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
                return(
                  <React.Fragment key={grp.key}>
                  <tr className={isExp?'g-sel':''} onClick={()=>setExpRow(isExp?null:grp.key)} style={{cursor:'pointer'}}>
                    {/* Line 1: deadline + status + amount (on mobile: all in one flex row) */}
                    <td className="mob-line1">
                      <span style={{fontSize:10,color:'var(--tf)',transition:'transform .2s',display:'inline-block',transform:isExp?'rotate(90deg)':'rotate(0deg)'}}><i className="fa-solid fa-chevron-right"/></span>
                      {nd&&nd.deadline?(
                        <span className={`g-deadline ${dc}`}>{fmtDateShort(nd.deadline)}</span>
                      ):(
                        <span className="g-deadline" style={{color:'var(--tf)'}}>—</span>
                      )}
                      {nd&&nd.deadline&&<span className={`fd-rel ${dc}`} style={{fontSize:8,fontWeight:600,whiteSpace:'nowrap'}}>{relStr}</span>}
                      {dType&&<span className={`fd-type ${dType==='DDLNE!'?'hard':'est'}`}>{dType==='DDLNE!'?'Hard':'Est.'}</span>}
                    </td>
                    {/* Line 2: Foundation */}
                    <td className="flat-fname" style={{fontWeight:600,maxWidth:220,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                      {grp.foundation}<CopyBtn text={grp.foundation}/>
                    </td>
                    {/* Line 3: Grant program + semáforo */}
                    <td className="flat-gname">
                      <span className="g-name" style={{display:'inline'}}>{grp.grant||'—'}{grp.grant&&<CopyBtn text={grp.grant}/>}</span>
                      <span className="prog-sem" style={{marginLeft:6}}>
                        {semEntries.map(e=>{
                          const yr=e.deadline?e.deadline.substring(2,4):'?';
                          const cls=e.nextStep==='05 Received'?'received':e.nextStep==='04 Denied'?'denied':e.nextStep==='03 Waiting Results'?'waiting':e.nextStep==='07 Missed Deadline'?'missed':e.nextStep==='08 Not Eligible'?'notelig':e.nextStep==='02 Check'?'check':'apply';
                          return <span key={e.id} className="sem-yr"><span className={`sem-dot ${cls}`}/><span className="sem-lbl">{yr}</span></span>;
                        })}
                      </span>
                    </td>
                    {/* Desktop-only separate cells */}
                    <td className="desk-only"><span className={`ns ${STEP_CSS[latestStep]||'ns-check'}`}>{STEP_SHORT[latestStep]||latestStep}</span></td>
                    <td className="desk-only" style={{fontSize:10,color:'var(--td)'}}>{grp.entries.length} app{grp.entries.length>1?'s':''}</td>
                    <td className="desk-only">
                      <div style={{display:'flex',gap:3}}>
                        {grp.received>0&&<span className="ms ms-g">✓{grp.received}</span>}
                        {grp.waiting>0&&<span className="ms ms-b"><i className="fa-solid fa-hourglass-half"/>{grp.waiting}</span>}
                        {grp.denied>0&&<span className="ms ms-r">✗{grp.denied}</span>}
                      </div>
                    </td>
                    <td className="desk-only" style={{fontVariantNumeric:'tabular-nums',fontSize:11,color:'var(--td)'}}>{grp.primary.amount?fmt(grp.primary.amount,grp.primary.currency||'USD'):''}</td>
                    <td className="desk-only" style={{fontVariantNumeric:'tabular-nums',fontWeight:700,color:'var(--g)',fontSize:11}}>{grp.totalAmt>0?fmtByCur(grp.totalAmtByCur):''}</td>
                    <td className="desk-only" style={{textAlign:'center'}}>
                      <div style={{display:'flex',gap:5,justifyContent:'center'}}>
                        {grp.primary.web&&<a href={grp.primary.web} target="_blank" rel="noreferrer" className="btn-icon btn-icon-web" onClick={e=>e.stopPropagation()} title="Ver Convocatoria"><i className="fa-solid fa-arrow-up-right-from-square"/></a>}
                        {grp.primary.bases&&<a href={grp.primary.bases} target="_blank" rel="noreferrer" className="btn-icon btn-icon-pdf" onClick={e=>e.stopPropagation()} title="Ver Bases (PDF)"><i className="fa-solid fa-file-pdf"/></a>}
                      </div>
                    </td>
                    {/* Mobile-only: combined right-side stats */}
                    <td className="mob-right">
                      <span className={`ns ${STEP_CSS[latestStep]||'ns-check'}`}>{STEP_SHORT[latestStep]||latestStep}</span>
                      <span style={{fontSize:9,color:'var(--td)'}}>{grp.entries.length}</span>
                      {grp.received>0&&<span className="ms ms-g" style={{fontSize:8}}>✓{grp.received}</span>}
                      {grp.waiting>0&&<span className="ms ms-b" style={{fontSize:8}}><i className="fa-solid fa-hourglass-half"/>{grp.waiting}</span>}
                      {grp.denied>0&&<span className="ms ms-r" style={{fontSize:8}}>✗{grp.denied}</span>}
                      {grp.primary.amount&&grp.totalAmt===0&&<span style={{fontVariantNumeric:'tabular-nums',fontSize:9,color:'var(--td)'}}>{fmt(grp.primary.amount,grp.primary.currency||'USD')}</span>}
                      {grp.totalAmt>0&&<span style={{fontVariantNumeric:'tabular-nums',fontWeight:700,color:'var(--g)',fontSize:9}}>{fmtByCur(grp.totalAmtByCur)}</span>}
                    </td>
                  </tr>
                  {isExp&&(
                    <tr><td colSpan={9} style={{padding:0}}>
                      <div className="hist-panel" onClick={e=>e.stopPropagation()}>
                        {/* Application Timeline */}
                        <div>
                          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',color:'var(--tf)',marginBottom:8}}>
                            Application Timeline ({grp.entries.length})
                          </div>
                          {grp.entries.map((e,i)=><AppEntry key={e.id} e={e} isLast={i===grp.entries.length-1} onChangeStatus={changeStatus} onChangeField={changeField} onDelete={delEntry} onDuplicate={dupEntry}/>)}
                        </div>
                      </div>
                    </td></tr>
                  )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
          </div>
        )}
      </div>

      {showSuggestions&&(
        <div className="modal-ov" onClick={()=>setShowSuggestions(false)}>
          <div className="modal" style={{maxWidth:640}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <h3 style={{margin:0}}>💡 Suggestions inbox {suggestions.length>0&&<span style={{background:'var(--rbg)',color:'var(--r)',borderRadius:3,padding:'2px 8px',fontSize:11,marginLeft:6,fontWeight:700}}>{suggestions.length}</span>}</h3>
              <button className="btn btn-sec" onClick={()=>setShowSuggestions(false)}><i className="fa-solid fa-xmark"/></button>
            </div>
            {suggestions.length===0?(
              <div style={{textAlign:'center',padding:'32px 0',color:'var(--tf)'}}>
                <div style={{fontSize:28,marginBottom:8}}>✓</div>
                No pending suggestions
              </div>
            ):suggestions.map(s=>{
              const gd=s.grant_data||{};
              const hasFullData=Object.keys(gd).length>0;
              return(
              <div key={s.id} style={{background:'var(--s2)',border:'1px solid var(--bd)',borderRadius:3,padding:'12px 14px',marginBottom:10}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:6}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:13,marginBottom:1}}>{s.foundation}</div>
                    {s.grant_name&&<div style={{fontSize:11,color:'var(--td)'}}>{s.grant_name}</div>}
                  </div>
                  <div style={{fontSize:9,color:'var(--tf)',whiteSpace:'nowrap',flexShrink:0}}>{new Date(s.submitted_at).toLocaleDateString()}</div>
                </div>
                {/* Full data grid if submitted via AI batch form */}
                {hasFullData?(
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'3px 16px',fontSize:11,marginBottom:8}}>
                    {gd.deadline&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Deadline </span><span style={{color:'var(--t)'}}>{gd.deadline}</span>{gd.deadlineType==='DDLNE!'&&<span style={{color:'var(--r)',fontSize:9,marginLeft:4}}>HARD</span>}</div>}
                    {gd.amount&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Amount </span><span style={{color:'var(--g)',fontWeight:700}}>${Number(gd.amount).toLocaleString()}</span></div>}
                    {gd.nextStep&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Status </span><span style={{color:'var(--t)'}}>{gd.nextStep}</span></div>}
                    {gd.season&&<div><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Season </span><span style={{color:'var(--t)'}}>{gd.season}</span></div>}
                    {gd.eligiblePeriod&&<div style={{gridColumn:'1/-1'}}><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Period </span><span style={{color:'var(--t)'}}>{gd.eligiblePeriod}</span></div>}
                    {gd.web&&<div style={{gridColumn:'1/-1'}}><span style={{color:'var(--tf)',fontSize:9,textTransform:'uppercase',letterSpacing:'.06em'}}>Web </span><a href={gd.web} target="_blank" rel="noreferrer" style={{color:'var(--b)'}}>{gd.web}</a></div>}
                  </div>
                ):(
                  <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:11,color:'var(--tf)',marginBottom:6}}>
                    {s.deadline&&<span><i className="fa-solid fa-calendar-days"/> {s.deadline}</span>}
                    {s.web&&<a href={s.web} target="_blank" rel="noreferrer" style={{color:'var(--b)'}}>{s.web}</a>}
                  </div>
                )}
                {(gd.notes||s.notes)&&<div style={{fontSize:11,color:'var(--td)',marginBottom:10,lineHeight:1.5,background:'var(--s3)',borderRadius:2,padding:'5px 8px'}}>{gd.notes||s.notes}</div>}
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-pri" style={{flex:1,fontSize:11}} onClick={()=>acceptSuggestion(s,add,setSuggestions)}>✓ Añadir al Tracker</button>
                  <button className="btn btn-sec" style={{fontSize:11}} onClick={()=>rejectSuggestion(s.id,setSuggestions)}>✕</button>
                </div>
              </div>
            );})}
          </div>
        </div>
      )}
      {showAdd&&(
        <div className="modal-ov" onClick={()=>setShowAdd(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <AddModal onClose={()=>{setShowAdd(false);setAddPrefill(null);}} onAdd={add} prefill={addPrefill}/>
          </div>
        </div>
      )}
    </div>
  );
}

function AddModal({onClose,onAdd,prefill}){
  const pf=prefill||{};
  const[f,sF]=useState({id:Date.now(),deadline:'',deadlineType:'Estimated',foundation:pf.foundation||'',grant:pf.grant||'',nextStep:'02 Check',web:pf.web||'',bases:'',notes:'',amount:null,amountReceived:null,currency:'USD',eligiblePeriod:'',projectDates:'',improvements:'',source:'calendar',reportDeadline:'',season:pf.season||''});
  const s=(k,v)=>sF(p=>({...p,[k]:v}));
  return(
    <>
      <h3>Add Grant</h3>
      <div className="mf"><label>Foundation *</label><input value={f.foundation} onChange={e=>s('foundation',e.target.value)} placeholder="Foundation name"/></div>
      <div className="mf"><label>Grant program</label><input value={f.grant} onChange={e=>s('grant',e.target.value)} placeholder="Specific grant name"/></div>
      <div className="mf"><label>Deadline *</label><input type="date" value={f.deadline} onChange={e=>s('deadline',e.target.value)}/></div>
      <div style={{display:'flex',gap:8}}>
        <div className="mf" style={{flex:1}}><label>Type</label><select value={f.deadlineType} onChange={e=>s('deadlineType',e.target.value)}><option value="DDLNE!">Hard Deadline</option><option value="Estimated">Estimated Deadline</option></select></div>
        <div className="mf" style={{flex:1}}><label>Status</label><select value={f.nextStep} onChange={e=>s('nextStep',e.target.value)}>{STEPS.map(st=><option key={st} value={st}>{STEP_SHORT[st]}</option>)}</select></div>
        <div className="mf" style={{flex:1}}><label>Season</label><select value={f.season||''} onChange={e=>s('season',e.target.value)}><option value="">—</option><option value="Spring">Spring</option><option value="Summer">Summer</option><option value="Fall">Fall</option><option value="Winter">Winter</option><option value="Closed">Closed</option></select></div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <div className="mf" style={{flex:1}}><label>Amount Requested</label><input type="number" value={f.amount||''} onChange={e=>s('amount',e.target.value?parseFloat(e.target.value):null)}/></div>
        <div className="mf" style={{flex:1}}><label>Amount Received</label><input type="number" value={f.amountReceived||''} onChange={e=>s('amountReceived',e.target.value?parseFloat(e.target.value):null)}/></div>
        <div className="mf" style={{flex:'0 0 auto'}}><label>Currency</label><div className="cur-toggle" style={{height:28}}><button type="button" className={`cur-btn${f.currency==='USD'?' on':''}`} onClick={()=>s('currency','USD')}>$ USD</button><button type="button" className={`cur-btn${f.currency==='EUR'?' on':''}`} onClick={()=>s('currency','EUR')}>€ EUR</button></div></div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <div className="mf" style={{flex:1}}><label>Web / Link</label><input value={f.web} onChange={e=>s('web',e.target.value)} placeholder="https://..."/></div>
        <div className="mf" style={{flex:1}}><label>Bases (PDF)</label><input value={f.bases} onChange={e=>s('bases',e.target.value)} placeholder="https://...pdf"/></div>
      </div>
      <div className="mf"><label>Report Deadline</label><input type="date" value={f.reportDeadline} onChange={e=>s('reportDeadline',e.target.value)}/></div>
      <div className="mf"><label>Notes</label><textarea value={f.notes} onChange={e=>s('notes',e.target.value)}/></div>
      <div className="ma">
        <button className="btn btn-sec" onClick={onClose}>Cancel</button>
        <button className="btn btn-pri" onClick={()=>{if(f.foundation.trim()){onAdd(f);onClose();}}}>Add</button>
      </div>
    </>
  );
}

// App is started by the data loader above
</script>
</body>
</html>
