<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Polen · Full Data Export</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f1;--s1:#ffffff;--s2:#efeadd;--s3:#e3ddca;
  --bd:#d4cdb8;--t:#0e0d0a;--td:#5a5446;--tf:#8b8475;
  --ac:#d39400;--r:#c83434;--g:#2d8f4a;
  --font:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
html.dark{
  --bg:#0e0d0a;--s1:#15130f;--s2:#1c1a14;--s3:#26221a;
  --bd:#2a2620;--t:#f4ede0;--td:#8a8475;--tf:#5c5749;
  --ac:#ffd233;--r:#ff6b6b;--g:#6ee08e;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--t);font-size:12px;line-height:1.5;}
.nav{display:flex;align-items:center;gap:2px;padding:0 12px;background:var(--s1);border-bottom:1px solid var(--bd);height:40px;position:sticky;top:0;z-index:10;}
.nav-brand{font-size:13px;font-weight:800;color:var(--ac);letter-spacing:.06em;padding:0 10px 0 2px;margin-right:4px;border-right:1px solid var(--bd);flex-shrink:0;}
.nav-link{background:none;border:none;color:var(--td);font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:all .15s;font-family:var(--font);white-space:nowrap;}
.nav-link:hover{color:var(--t);background:var(--s3);}
.nav-link.active{color:var(--ac);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.theme-btn{background:none;border:1px solid var(--bd);color:var(--td);border-radius:3px;padding:3px 8px;font-size:13px;cursor:pointer;line-height:1;transition:all .15s;}
.theme-btn:hover{border-color:var(--ac);color:var(--t);}
.wrap{padding:20px;max-width:1200px;}
.page-title{font-size:13px;font-weight:700;color:var(--t);margin-bottom:2px;letter-spacing:.03em;}
.sub{color:var(--tf);font-size:11px;margin-bottom:20px;}
.section{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--tf);margin-bottom:6px;margin-top:20px;}
.stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;}
.stat strong{color:var(--ac);font-size:16px;font-weight:800;display:block;margin-bottom:1px;}
.stat span{font-size:10px;color:var(--tf);text-transform:uppercase;letter-spacing:.06em;}
pre{background:var(--s2);border:1px solid var(--bd);padding:14px 16px;overflow-x:auto;font-size:11px;color:var(--td);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
#msg{color:var(--tf);padding:20px 0;}
#err{color:var(--r);padding:20px 0;display:none;}
.copy-btn{background:var(--s2);border:1px solid var(--bd);color:var(--td);border-radius:3px;padding:4px 10px;font-size:10px;font-family:var(--font);cursor:pointer;transition:all .15s;}
.copy-btn:hover{border-color:var(--ac);color:var(--t);}
.copy-btn.ok{border-color:var(--g);color:var(--g);}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-brand">POLEN</span>
  <a href="." class="nav-link">App</a>
  <a href="json-3e8f1a7b4c2d9e0f.html" class="nav-link active">JSON Export</a>
  <div class="nav-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-title">FULL DATA EXPORT</div>
  <div class="sub" id="sub">Loading…</div>

  <div id="msg">Fetching data…</div>
  <div id="err"></div>

  <div id="main" style="display:none">
    <div class="stats">
      <div class="stat"><strong id="cnt-grants">—</strong><span>Grants</span></div>
      <div class="stat"><strong id="cnt-received">—</strong><span>Received</span></div>
      <div class="stat"><strong id="cnt-waiting">—</strong><span>Waiting</span></div>
      <div class="stat"><strong id="cnt-suggestions">—</strong><span>Suggestions</span></div>
    </div>

    <div class="section" style="display:flex;align-items:center;gap:8px">
      <span>grants — full history</span>
      <button class="copy-btn" id="copy-grants" onclick="copyJSON('grants')">Copy JSON</button>
    </div>
    <pre id="json-grants"></pre>

    <div class="section" style="display:flex;align-items:center;gap:8px;margin-top:28px">
      <span>suggestions — pending &amp; processed</span>
      <button class="copy-btn" id="copy-suggestions" onclick="copyJSON('suggestions')">Copy JSON</button>
    </div>
    <pre id="json-suggestions"></pre>

    <div class="section" style="margin-top:28px">combined export</div>
    <pre id="json-combined"></pre>
  </div>
</div>

<script>
(function(){
  const t=localStorage.getItem('polen-theme');
  if(t==='dark')document.documentElement.classList.add('dark');
  document.getElementById('theme-btn').textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';
})();
function toggleTheme(){
  const dark=document.documentElement.classList.toggle('dark');
  localStorage.setItem('polen-theme',dark?'dark':'light');
  document.getElementById('theme-btn').textContent=dark?'☀️':'🌙';
}

const SB='https://aqehbiyjofsxavndjfjj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxZWhiaXlqb2ZzeGF2bmRqZmpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NjUwMzUsImV4cCI6MjA5NDM0MTAzNX0.WgMseUQ6YbtZPjjx1i_VuRXTpSI7n9OD6QLUImmmPU0';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};

let _grants=[], _suggestions=[];

function copyJSON(which){
  const text=which==='grants'?JSON.stringify(_grants,null,2):JSON.stringify(_suggestions,null,2);
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('copy-'+which);
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy JSON';btn.classList.remove('ok');},2000);
  });
}

async function load(){
  try{
    const [r1,r2]=await Promise.all([
      fetch(`${SB}/rest/v1/grants_blob?select=data&id=eq.1`,{headers:H}),
      fetch(`${SB}/rest/v1/suggestions?select=*&order=created_at.desc`,{headers:H})
    ]);
    if(!r1.ok)throw new Error('grants_blob: HTTP '+r1.status);
    if(!r2.ok)throw new Error('suggestions: HTTP '+r2.status);
    const [blob,suggs]=await Promise.all([r1.json(),r2.json()]);
    if(!blob.length)throw new Error('No grants data found');

    _grants=blob[0].data||[];
    _suggestions=suggs||[];

    document.getElementById('msg').style.display='none';
    document.getElementById('main').style.display='block';
    document.getElementById('cnt-grants').textContent=_grants.length;
    document.getElementById('cnt-received').textContent=_grants.filter(g=>g.nextStep==='05 Received').length;
    document.getElementById('cnt-waiting').textContent=_grants.filter(g=>g.nextStep==='03 Waiting Results').length;
    document.getElementById('cnt-suggestions').textContent=_suggestions.length;

    document.getElementById('json-grants').textContent=JSON.stringify(_grants,null,2);
    document.getElementById('json-suggestions').textContent=JSON.stringify(_suggestions,null,2);
    document.getElementById('json-combined').textContent=JSON.stringify({
      exported_at:new Date().toISOString(),
      grants:_grants,
      suggestions:_suggestions
    },null,2);

    document.getElementById('sub').textContent=`${_grants.length} grants · ${_suggestions.length} suggestions · ${new Date().toLocaleString()}`;
  }catch(e){
    document.getElementById('msg').style.display='none';
    const el=document.getElementById('err');el.style.display='block';
    el.textContent='Error: '+e.message;
  }
}
load();
</script>
</body>
</html>
