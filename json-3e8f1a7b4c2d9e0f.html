<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Polen · Data Export</title>
<style>
body{margin:0;background:#0e0d0a;color:#c8c0b0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;}
pre{padding:20px;white-space:pre-wrap;word-break:break-word;line-height:1.6;}
#msg{padding:20px;color:#5c5749;}
</style>
</head>
<body>
<pre id="msg">Loading…</pre>
<pre id="out" style="display:none"></pre>
<script>
const SB='https://aqehbiyjofsxavndjfjj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxZWhiaXlqb2ZzeGF2bmRqZmpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NjUwMzUsImV4cCI6MjA5NDM0MTAzNX0.WgMseUQ6YbtZPjjx1i_VuRXTpSI7n9OD6QLUImmmPU0';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
(async()=>{
  try{
    const[r1,r2]=await Promise.all([
      fetch(`${SB}/rest/v1/grants_blob?select=data&id=eq.1`,{headers:H}),
      fetch(`${SB}/rest/v1/suggestions?select=*&order=submitted_at.desc`,{headers:H})
    ]);
    const[b,s]=await Promise.all([r1.json(),r2.json()]);
    document.getElementById('msg').style.display='none';
    const out=document.getElementById('out');
    out.style.display='block';
    out.textContent=JSON.stringify({exported_at:new Date().toISOString(),grants:b[0]?.data||[],suggestions:s},null,2);
  }catch(e){
    document.getElementById('msg').textContent='Error: '+e.message;
  }
})();
</script>
</body>
</html>
